/* ═════════════════════════════════════════════════════════════════════
   UTILITAIRES
   ═════════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');
const safeName=s=>String(s||'').toLowerCase().replace(/[^a-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');

const ERR_FR={400:'Requête refusée (paramètres invalides).',401:'Clé API invalide ou expirée.',402:'Compte sans crédit suffisant.',403:'Accès refusé.',404:'Ressource introuvable.',408:'Délai dépassé.',429:'Trop de requêtes : attends une minute.',500:'Erreur serveur Agnes.',502:'Passerelle Agnes indisponible.',503:'Serveur Agnes saturé.',504:'Délai serveur dépassé.'};
const frErr=(code,msg)=>(ERR_FR[code]||('Erreur HTTP '+code))+(msg?(' — '+String(msg).slice(0,100)):'');

let db=null,P=null,page=0,F=1,saveTimer=null,savePending=false;
const KEYS={list:[],plan:'free',revealed:false};
const AR=()=>((P&&P.ratio)||'9:16').replace(':','/');
const ref=i=>i&&(i.d||i.u);
const mkKey=k=>({k,img:0,vid:0,cool:0,bad:0,off:false});
let keyIdx=0;

/* Locks */
const LOCKS=new Set();
function lock(id){if(LOCKS.has(id))return false;LOCKS.add(id);return true;}
function unlock(id){LOCKS.delete(id);}
function isLocked(id){return LOCKS.has(id);}

/* Abort controllers */
const ABORTS=new Map();
function registerAbort(id){const c=new AbortController();ABORTS.set(id,c);return c;}
function clearAbort(id){ABORTS.delete(id);}
function abortTask(id){const c=ABORTS.get(id);if(c&&!c.signal.aborted)c.abort();}
function isAborted(id){const c=ABORTS.get(id);return c&&c.signal.aborted;}

/* ═════════════════════════════════════════════════════════════════════
   STOCKAGE — IndexedDB + fallback localStorage + vérification quota
   ═════════════════════════════════════════════════════════════════════ */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('scifi_studio_v4',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'})}})}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
let mode='idb';
const mem={projects:{},config:{}};
const lsK=(s,k)=>'scifi4_'+s+'_'+k;
function fall(){if(mode==='idb'){mode='ls';log('wr','IndexedDB indisponible → localStorage (limité)');}}

async function dbGet(s,k){
  if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.get(k))}catch(e){fall()}}
  try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v)}catch(e){}
  return mem[s][k];
}
async function dbPut(s,v){
  const k=v.key||v.id;
  mem[s][k]=v;
  if(db&&mode==='idb'){
    try{return await tx(s,'readwrite',o=>o.put(v))}
    catch(e){
      // Vérifier quota
      try{
        const est=await navigator.storage.estimate();
        const remaining=est.quota-est.usage;
        log('er','IndexedDB : stockage plein (reste ~'+(remaining/1024/1024).toFixed(1)+' Mo)');
        toast('⚠️ Stockage saturé — exporte ton projet');
      }catch(_){log('er','IndexedDB en erreur : '+e.message)}
      fall();
    }
  }
  try{
    localStorage.setItem(lsK(s,k),JSON.stringify(v));
    return true;
  }catch(e){
    log('er','localStorage plein — sauvegarde incomplète');
    toast('⚠️ Sauvegarde impossible — exporte maintenant');
    return false;
  }
}
async function dbDel(s,k){delete mem[s][k];if(db&&mode==='idb'){try{return await tx(s,'readwrite',o=>o.delete(k))}catch(e){fall()}}try{localStorage.removeItem(lsK(s,k))}catch(e){}}
async function dbAll(s){
  if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.getAll())}catch(e){fall()}}
  const o=Object.assign({},mem[s]);
  try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith(lsK(s,''))){const v=JSON.parse(localStorage.getItem(n));o[v.key||v.id]=v}}}catch(e){}
  return Object.values(o);
}

/* Sauvegarde débouncée + flush */
function save(){
  if(!P)return;
  savePending=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    P.upd=Date.now();
    savePending=false;
    await dbPut('projects',P).catch(e=>log('er','sauvegarde : '+e.message));
  },400);
}
async function flushSave(){
  if(!savePending||!P)return;
  clearTimeout(saveTimer);
  savePending=false;
  P.upd=Date.now();
  await dbPut('projects',P).catch(e=>log('er','sauvegarde immédiate : '+e.message));
}

/* ═════════════════════════════════════════════════════════════════════
   LOG + TOAST
   ═════════════════════════════════════════════════════════════════════ */
function log(l,m){const d=document.createElement('div');d.className='lg '+l;d.textContent=new Date().toLocaleTimeString('fr-FR')+'  '+m;const b=$('#lb');if(!b)return;b.appendChild(d);while(b.children.length>500)b.firstChild.remove();b.scrollTop=b.scrollHeight}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}

/* ═════════════════════════════════════════════════════════════════════
   RATE LIMITING — séparation img / vid
   ═════════════════════════════════════════════════════════════════════ */
async function slot(kind){
  // kind ∈ {'img','vid'}
  for(;;){
    let live=KEYS.list.filter(o=>!o.off);
    if(!live.length&&KEYS.list.length){KEYS.list.forEach(o=>{o.off=false;o.bad=0;o.cool=0});live=KEYS.list}
    if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const rpm=RPM[KEYS.plan][kind]||10;
    const iv=60000/rpm*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){const t=Math.max(o[kind]||0,o.cool||0,now);if(t<bt){bt=t;best=o}}
    if(bt>now){await sleep(Math.min(bt-now,400));continue}
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;
    return best;
  }
}

/* Appel API avec slot image ou video */
async function callApi(kind,url,body,signal){
  let lastErr=null;
  for(let a=0;a<3;a++){
    const o=await slot(kind);
    try{
      const opt={method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+o.k},body:JSON.stringify(body)};
      if(signal)opt.signal=signal;
      const r=await fetch(url,opt);
      if(r.ok){o.bad=0;F=Math.max(1,F*0.97);return r}
      const t=await r.text().catch(()=>'');
      log('er','HTTP '+r.status+' '+(t||'').slice(0,180));
      if(r.status===429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||30)*1000;F=Math.min(4,F*1.5);lastErr=new Error(frErr(429));continue}
      if(r.status===401){o.bad++;if(o.bad>=2)o.off=true;lastErr=new Error(frErr(401));continue}
      if(r.status>=500){lastErr=new Error(frErr(r.status));await sleep(2500*Math.pow(2,a));continue}
      throw Object.assign(new Error(frErr(r.status,t)),{fatal:true});
    }catch(e){
      if(e.name==='AbortError')throw e;
      if(e.fatal)throw e;
      lastErr=e;
      await sleep(1500*(a+1));
    }
  }
  throw lastErr||new Error('Échec réseau');
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGE / DATA URL
   ═════════════════════════════════════════════════════════════════════ */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{try{const s=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(o);resolve(c.toDataURL('image/jpeg',0.86))}catch(e){URL.revokeObjectURL(o);resolve(null)}};
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};im.src=o;
    }).catch(()=>resolve(null));
  });
}
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d}).catch(()=>{img.d=img.u;return img.d});
  return img._conv;
}
async function mkImg(prompt,refUris,ratio,signal){
  const body={model:IMG,prompt:san(prompt),n:1,size:'1K',ratio:ratio||(P?P.ratio:'9:16'),extra_body:{response_format:'url'}};
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,MAX_REF);
  const r=await callApi('img',PX(AGNES_API+'/images/generations'),body,signal);
  const d=await r.json();
  const it=d.data&&d.data[0];
  const u=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
  if(!u)throw new Error('Aucune image reçue de l\'API');
  const img={u:u,d:u.indexOf('data:')===0?u:null};
  if(!img.d)img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=u;return img.d});
  return img;
}

/* Normaliser un projet importé */
function normalizeProject(p){
  const out=Object.assign(newP(),p||{});
  out.id=out.id||uid()+uid();
  out.created=out.created||Date.now();
  out.upd=Date.now();
  if(!Array.isArray(out.characters)||!out.characters.length)out.characters=CHAR_DEFAULTS.map(newChar);
  out.characters=out.characters.map(c=>{
    const base=CHAR_DEFAULTS.find(x=>x.id===c.id)||{id:c.id||uid(),name:c.name||'Personnage',desc:c.desc||''};
    const views=VIEW_DEFS.map(def=>{
      const found=Array.isArray(c.views)?c.views.find(v=>v.id===def.id):null;
      return {id:def.id,label:def.label,en:def.en,prompt:(found&&found.prompt)||'',img:(found&&found.img)||null,busy:false,err:''};
    });
    return {id:base.id,name:base.name,desc:c.desc||base.desc,views,principalViewId:c.principalViewId||'face'};
  });
  if(!Array.isArray(out.boards))out.boards=[];
  out.boards=out.boards.map(b=>newBoard(b));
  if(!out.boards.length)out.boards=BOARDS_DEFAULTS.map(newBoard);
  return out;
}

   ═════════════════════════════════════════════════════════════════════ */
async function genCharView(cid,vid){
  const key=cid+'/'+vid;
  if(!lock(key))return toast('Génération déjà en cours pour cette vue');
  const c=findChar(cid);
  const v=c&&c.views.find(x=>x.id===vid);
  if(!c||!v){unlock(key);return}
  v.busy=true;v.err='';refresh();
  const ctrl=registerAbort(key);
  try{
    const refs=[];
    const pv=c.views.find(x=>x.id===(c.principalViewId||'face'));
    if(pv&&pv.img&&pv.id!==v.id)refs.push(await ensureRef(pv.img));
    log('in','Vue '+cid+'/'+vid+' · refs='+refs.length);
    v.img=await mkImg(charViewPrompt(c,v),refs,'1:1',ctrl.signal);
    log('ok','Vue '+cid+'/'+vid+' générée');
    toast('✓ '+cid+' / '+vid);
  }catch(e){
    if(e.name==='AbortError'){v.err='Annulé';log('wr','vue '+cid+'/'+vid+' annulée')}
    else{v.err=e.message||'Échec';log('er','vue '+cid+'/'+vid+' : '+(e.message||e))}
  }finally{
    clearAbort(key);unlock(key);v.busy=false;
    await flushSave();refresh();
  }
}

async function genPanelImg(pid){
  if(!lock(pid))return toast('Génération déjà en cours pour cette case');
  const f=findPanel(pid);
  if(!f){unlock(pid);return}
  const p=f.panel;p.busy=true;p.err='';refresh();
  const ctrl=registerAbort(pid);
  try{
    const refs=[];
    const charList=(p.chars||[]).slice(0,MAX_REF);

      const c=findChar(cid);if(!c)continue;
      const pv=c.views.find(v=>v.id===(c.principalViewId||'face'));

    if((p.chars||[]).length>MAX_REF)log('wr','Panel '+pid+' : '+(p.chars.length)+' pers, seules '+MAX_REF+' refs envoyées');

    else{p.err=e.message||'Échec';log('er','panel '+pid+' : '+(e.message||e))}
  }finally{
    clearAbort(pid);unlock(pid);p.busy=false;
    await flushSave();refresh();
  }
}

/* ═════════════════════════════════════════════════════════════════════
   TÉLÉCHARGEMENTS — data: ET http(s):
   ═════════════════════════════════════════════════════════════════════ */
async function fetchAsDataUrl(url){
  if(!url)return null;
  if(url.indexOf('data:')===0)return url;
  // Essai direct
  try{
    const r=await fetch(url,{mode:'cors'});
    if(r.ok){
      const b=await r.blob();
      return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b)});
    }
  }catch(e){/* CORS probablement */}
  // Fallback via proxy (pour les URLs Agnes)
  try{
    const r=await fetch(PX(url));
    if(r.ok){
      const b=await r.blob();
      return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b)});
    }
  }catch(e){/* échec */}
  return null;
}
function triggerDownload(dataUrl,filename){
  try{
    const a=document.createElement('a');
    a.href=dataUrl;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    return true;
  }catch(e){log('er','Téléchargement échoué : '+e.message);return false}
}
async function dlImage(img,filename){
  if(!img)return toast('Aucune image');
  const url=img.d||img.u;
  if(!url)return toast('Image sans données');
  const dataUrl=url.indexOf('data:')===0?url:await fetchAsDataUrl(url);
  if(!dataUrl)return toast('❌ Téléchargement impossible (CORS ou lien expiré)');
  if(triggerDownload(dataUrl,filename))toast('⬇ '+filename);
}
async function dlZip(files,zipName){
  if(typeof JSZip==='undefined')return toast('JSZip non chargé — vérifie ta connexion');
  if(!files.length)return toast('Aucun fichier à zipper');
  toast('⏳ Préparation du ZIP ('+files.length+' fichier(s))…');
  const zip=new JSZip();
  let added=0,failed=0;
  for(const f of files){
    let dataUrl=f.dataUrl;
    if(!dataUrl)dataUrl=await fetchAsDataUrl(f.url);
    if(!dataUrl){failed++;log('er','Fichier ignoré : '+f.name);continue}
    const b64=dataUrl.split(',')[1];
    if(b64){zip.file(f.name,b64,{base64:true});added++}
    else failed++;
  }
  if(!added)return toast('❌ Aucun fichier téléchargeable (CORS)');
  try{
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    triggerDownload(url,zipName);
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('⬇ '+zipName+' ('+added+' fichier(s)'+(failed?', '+failed+' échec(s)':'')+')');
  }catch(e){toast('Erreur ZIP : '+e.message);log('er','ZIP : '+e.message)}
}
async function charFiles(cid){
  const c=findChar(cid);if(!c)return[];
  const out=[];
  for(const v of c.views){
    if(v.img)out.push({name:charFilename(cid,v.id),dataUrl:v.img.d,url:v.img.u});
  }
  return out;
}
async function boardFiles(bid){
  const b=P.boards.find(x=>x.id===bid);if(!b)return[];
  const out=[];
  for(const p of b.panels){
    if(p.img)out.push({name:panelFilename(p.id),dataUrl:p.img.d,url:p.img.u});
  }
  return out;
}
async function allFiles(){
  const out=[];
  for(const c of P.characters)out.push(...await charFiles(c.id));
  for(const b of P.boards)out.push(...await boardFiles(b.id));
  return out;
}

async function exportJSON(embed){
  const clean=JSON.parse(JSON.stringify(P));
  clean.task=null;
  for(const c of clean.characters||[])for(const v of c.views||[]){
    if(v.img){
      if(embed){v.img={u:v.img.u,d:v.img.d||await fetchAsDataUrl(v.img.u)||v.img.u}}
      else{v.img={u:v.img.u,note:'lien temporaire (non persisté)'}}
    }
  }
  for(const b of clean.boards||[])for(const p of b.panels||[]){
    if(p.img){
      if(embed){p.img={u:p.img.u,d:p.img.d||await fetchAsDataUrl(p.img.u)||p.img.u}}
      else{p.img={u:p.img.u,note:'lien temporaire (non persisté)'}}
    }
    if(p.video&&!embed)p.video=null;
    p.task=null;
  }
  const size=(JSON.stringify(clean).length/1024/1024).toFixed(1);
  const blob=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  triggerDownload(url,'projet_scifi_'+(embed?'complet_':'meta_')+P.id+'.json');
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  log('in','Export JSON ~'+size+' Mo');
  toast('JSON exporté ('+size+' Mo)');
}

function view(){const s=(P&&P.sub&&P.sub[page])||'cfg';const v=V[page];const fn=v[s]||v.cfg;return fn?fn():'<div class="hero">'+guide('Vue introuvable','er')+'</div>'}
function render(){
  if(!P)return;
  P.max=Math.max(P.max||0,page);P.page=page;
  $('#steps').innerHTML=STEPS.map((s,i)=>{const can=i!==page&&(i===0||(KEYS.list.length&&i<=P.max));return '<button class="st '+(i===page?'on':can?'ok':'')+'" '+(can?'data-a="go" data-n="'+i+'"':'disabled')+'>'+(i+1)+'. '+s+'</button>'}).join('');

function keysChips(){const e=$('#kl');if(!e)return;e.innerHTML=KEYS.list.map((k,i)=>'<span class="chip '+(k.off?'off':'')+'">#'+(i+1)+' …'+esc(k.k.slice(-4))+'</span>').join('')}
function refreshQui(){
  const c=$('#qchip');if(!c||!P)return;
  const panels=[];for(const b of P.boards)for(const p of b.panels)panels.push(p);
  const imgs=panels.filter(p=>p.img).length;
  const running=LOCKS.size;
  c.textContent='IMG · '+imgs+'/'+panels.length+(running?' · '+running+' en cours':'');
  c.className='chip '+(imgs===panels.length&&panels.length?'':'off');
}
async function updateStorageInfo(){
  const el=$('#storageInfo');if(!el)return;
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const est=await navigator.storage.estimate();
      const used=(est.usage/1024/1024).toFixed(1);
      const quota=(est.quota/1024/1024).toFixed(0);
      const pct=Math.min(100,est.usage/Math.max(1,est.quota)*100).toFixed(0);
      el.innerHTML=used+' Mo / '+quota+' Mo ('+pct+'%)';
    }else el.textContent='Quota non disponible';
  }catch(e){el.textContent='Indisponible'}
}

async function onClick(e){
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;

  if(a==='go'){
    await flushSave();
    page=+b.dataset.n;render();return;
  }
  if(a==='con'){$('#con').classList.toggle('on');return}
  if(a==='togglekey'){KEYS.revealed=!KEYS.revealed;render();return}

  if(a==='savekeys'){
    const ks=Array.from(new Set(($('#keyInput').value||'').split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=8)));
    if(!ks.length)return toast('Colle au moins une clé valide');
    KEYS.plan=$('#plan').value;
    KEYS.list=ks.map(k=>mkKey(k));
    await dbPut('config',{key:'keys',list:ks,plan:KEYS.plan}).catch(er=>log('wr','clés : '+er.message));
    toast('✓ '+ks.length+' clé(s) active(s)');
    page=1;render();return;
  }
  if(a==='clearkeys'){
    if(!confirm('Effacer la clé API du navigateur ?'))return;
    KEYS.list=[];KEYS.revealed=false;
    await dbDel('config','keys').catch(()=>{});
    toast('Clé effacée');
    render();return;
  }

  if(a==='abort'){const k=b.dataset.key;if(k){abortTask(k);log('wr','Annulation demandée pour '+k);toast('Annulation…')}return}

  if(a==='setprincipal'){const c=findChar(b.dataset.cid);if(!c)return;c.principalViewId=b.dataset.vid;save();refresh();return}
  if(a==='gencharview'){
    if(!KEYS.list.length)return toast('Enregistre d\'abord ta clé API');
    confirmModal('Générer une vue de référence',[
      ['Modèle',IMG],['Format','1:1'],
      ['Personnage',b.dataset.cid],['Vue',b.dataset.vid],
      ['Coût','INCONNU (non exposé)']
    ],()=>genCharView(b.dataset.cid,b.dataset.vid),'Générer');return;
  }
  if(a==='retry-char'){genCharView(b.dataset.cid,b.dataset.vid);return}
  if(a==='dlcharview'){
    const c=findChar(b.dataset.cid);const v=c&&c.views.find(x=>x.id===b.dataset.vid);
    if(v&&v.img)dlImage(v.img,charFilename(b.dataset.cid,b.dataset.vid));
    return;
  }
  if(a==='dlcharbundle'){dlZip(await charFiles(b.dataset.cid),'personnage_'+safeName(b.dataset.cid)+'.zip');return}

  if(a==='panel-dur'){const f=findPanel(id);if(f){f.panel.duration=+b.dataset.d;save();refresh()}return}
  if(a==='panel-chars'){
    const f=findPanel(id);if(!f)return;
    const inner=$('#modalInner');
    inner.innerHTML='<h3>Personnages — '+esc(id)+'</h3>'+
      P.characters.map(c=>{
        const checked=f.panel.chars.indexOf(c.id)>=0?'checked':'';
        return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" data-charpick="'+c.id+'" '+checked+'><span>'+esc(c.name)+'</span></label>';
      }).join('')+
      '<div class="info">Limite : <b>'+MAX_REF+'</b> références envoyées max par génération.</div>'+
      '<div class="rw" style="justify-content:flex-end;margin-top:10px">'+btn('modal-cancel','Fermer','ghost')+'</div>';
    $('#modal').classList.add('on');
    inner.querySelector('[data-a="modal-cancel"]').onclick=()=>{
      const checked=Array.from(inner.querySelectorAll('[data-charpick]')).filter(x=>x.checked).map(x=>x.dataset.charpick);
      f.panel.chars=checked;save();$('#modal').classList.remove('on');refresh();
    };
    return;
  }
  if(a==='panel-img'){
    if(!KEYS.list.length)return toast('Enregistre d\'abord ta clé API');
    const f=findPanel(id);if(!f)return;
    const refsCount=Math.min((f.panel.chars||[]).length,MAX_REF);
    confirmModal('Générer l\'image de '+id,[
      ['Modèle',IMG],['Format',P.ratio],
      ['Références',refsCount+'/'+MAX_REF],
      ['Coût','INCONNU (non exposé)']
    ],()=>genPanelImg(id),'Générer');return;
  }
  if(a==='retry-panel'){genPanelImg(id);return}
  if(a==='panel-dl'){
    const f=findPanel(id);if(!f||!f.panel.img)return;
    dlImage(f.panel.img,panelFilename(id));return;
  }
  if(a==='panel-vid'){launchVideo(id);return}
  if(a==='panel-add'){
    const board=P.boards.find(x=>x.id===b.dataset.bid);if(!board)return;
    const n=board.panels.length+1;
    const newId=board.id+'_P'+String(n).padStart(2,'0');
    board.panels.push(newPanel({id:newId,desc:'Nouvelle case',chars:[],decor:'',framing:'',action:'',imgPrompt:'',animPrompt:'',duration:4}));
    save();refresh();return;
  }
  if(a==='panel-del'){
    const f=findPanel(id);if(!f)return;
    if(!confirm('Supprimer la case '+id+' ?'))return;
    f.board.panels=f.board.panels.filter(x=>x.id!==id);save();refresh();return;
  }
  if(a==='board-add'){
    const n=P.boards.length+1;
    const newId='S'+String(n).padStart(2,'0');
    P.boards.push({id:newId,title:'Nouvelle scène',panels:[newPanel({id:newId+'_P01',desc:'Nouvelle case',chars:[],decor:'',framing:'',action:'',imgPrompt:'',animPrompt:'',duration:4})]});
    save();refresh();return;
  }
  if(a==='board-del'){
    if(!confirm('Supprimer la planche '+b.dataset.bid+' ?'))return;
    P.boards=P.boards.filter(x=>x.id!==b.dataset.bid);save();refresh();return;
  }
  if(a==='board-zip'){dlZip(await boardFiles(b.dataset.bid),'storyboard_'+safeName(b.dataset.bid)+'.zip');return}
  if(a==='export-full'){await exportJSON(true);return}
  if(a==='export-meta'){await exportJSON(false);return}
  if(a==='export-all-zip'){dlZip(await allFiles(),'projet_scifi_'+P.id+'.zip');return}
  if(a==='sess'){sessions();return}
  if(a==='new'){await flushSave();setP(newP());page=KEYS.list.length?1:0;const m=$('#md');if(m)m.remove();render();return}
}

/* INPUT */
document.addEventListener('input',e=>{
  const t=e.target;if(!P)return;
  if(t.dataset.chardesc){const c=findChar(t.dataset.chardesc);if(c){c.desc=t.value;save()}return}
  if(t.dataset.charPrompt){const[cid,vid]=t.dataset.charPrompt.split('/');const v=findView(cid,vid);if(v){v.prompt=t.value;save()}return}
  if(t.dataset.paneldesc){const f=findPanel(t.dataset.paneldesc);if(f){f.panel.desc=t.value;save()}return}
  if(t.dataset.panelimgprompt){const f=findPanel(t.dataset.panelimgprompt);if(f){f.panel.imgPrompt=t.value;save()}return}
  if(t.dataset.panelanimprompt){const f=findPanel(t.dataset.panelanimprompt);if(f){f.panel.animPrompt=t.value;save()}return}
  if(t.dataset.boardtitle){const b=P.boards.find(x=>x.id===t.dataset.boardtitle);if(b){b.title=t.value;save()}return}
});

/* CHANGE */
document.addEventListener('change',async e=>{
  const t=e.target;if(!P)return;
  if(t.id==='importFile'){const f=t.files[0];if(f)importJSON(f);return}
  if(t.dataset.upview){
    const[cid,vid]=t.dataset.upview.split('/');const v=findView(cid,vid);if(!v)return;
    const f=t.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=async()=>{
      const s=Math.min(1,1024/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const d=cv.toDataURL('image/jpeg',0.88);
      v.img={u:d,d:d};v.err='';await flushSave();refresh();
    };im.src=fr.result};
    fr.readAsDataURL(f);return;
  }
  if(t.dataset.uppanel){
    const f=findPanel(t.dataset.uppanel);if(!f)return;
    const file=t.files[0];if(!file)return;
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=async()=>{
      const s=Math.min(1,1024/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const d=cv.toDataURL('image/jpeg',0.88);
      f.panel.img={u:d,d:d};f.panel.err='';await flushSave();refresh();
    };im.src=fr.result};
    fr.readAsDataURL(file);return;
  }
});
