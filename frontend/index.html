/* ═════════════════════════════════════════════════════════════════════

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('xenoscope_v10',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'});}});}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});

async function dbGet(s,k){if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.get(k));}catch(e){fall();}}try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v);}catch(e){}return mem[s][k];}
async function dbPut(s,v){const k=v.key||v.id;mem[s][k]=v;if(db&&mode==='idb'){try{return await tx(s,'readwrite',o=>o.put(v));}catch(e){fall();}}if(s==='config'||s==='projects'){try{localStorage.setItem(lsK(s,k),JSON.stringify(v));return true;}catch(e){return false;}}return false;}
async function dbDel(s,k){delete mem[s][k];if(db&&mode==='idb'){try{return await tx(s,'readwrite',o=>o.delete(k));}catch(e){fall();}}try{localStorage.removeItem(lsK(s,k));}catch(e){}}
async function dbAll(s){if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.getAll());}catch(e){fall();}}const o=Object.assign({},mem[s]);if(s==='config'||s==='projects'){try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith(lsK(s,''))){const v=JSON.parse(localStorage.getItem(n));o[v.key||v.id]=v;}}}catch(e){}}return Object.values(o);}

/* ═════════════════════════════════════════════════════════════════════

   ═════════════════════════════════════════════════════════════════════ */
function blobToBytes(blob){return blob.arrayBuffer().then(b=>new Uint8Array(b));}
function bytesToBase64(bytes){
  let binary='';const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}
  return btoa(binary);
}
async function saveAssetFromBlob(blob,mime,tag){
  if(!blob||!blob.size)throw new Error('Blob vide');
  const bytes=await blobToBytes(blob);
  if(!bytes||bytes.length<200)throw new Error('Binaire anormal ('+bytes.length+' o)');
  /* Détecter le type réel via magic bytes */
  let realMime=mime||blob.type||'application/octet-stream';
  if(bytes[0]===0xFF&&bytes[1]===0xD8)realMime='image/jpeg';

async function assembleList(panels){if(!panels.length)throw new Error('Aucune case');const missing=panels.filter(p=>!p.img||!p.img.assetId).map(p=>p.id);if(missing.length)throw new Error('Images manquantes : '+missing.slice(0,6).join(', '));showAsmStatus('Chargement moteur',1,'');const ffmpeg=await loadFFmpeg();showAsmStatus('Préparation',5,'');const concatLines=[];const written=[];for(let i=0;i<panels.length;i++){const p=panels[i];const blob=await getAssetBlob(p.img.assetId);if(!blob)throw new Error('Asset introuvable pour '+p.id);const bytes=await blobToBytes(blob);const fname='i_'+String(i).padStart(4,'0')+'.png';await ffmpeg.writeFile(fname,bytes);written.push(fname);const dur=Math.max(1,Math.min(15,p.duration||5));concatLines.push(`file '${fname}'`);concatLines.push(`duration ${dur}`);}if(written.length)concatLines.push(`file '${written[written.length-1]}'`);await ffmpeg.writeFile('list.txt',new TextEncoder().encode(concatLines.join('\n')));showAsmStatus('Assemblage',40,'1080×1920 · 30 FPS');const vf=[`scale=${ASM_W}:${ASM_H}:force_original_aspect_ratio=decrease`,`pad=${ASM_W}:${ASM_H}:(ow-iw)/2:(oh-ih)/2:color=black`,`zoompan=z='min(zoom+0.0015,1.15)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=${ASM_W}x${ASM_H}:fps=${ASM_FPS}`,`format=yuv420p`].join(',');try{await ffmpeg.exec(['-f','concat','-safe','0','-i','list.txt','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','-movflags','+faststart','out.mp4']);}catch(e){throw new Error('ffmpeg : '+(e.message||e));}const data=await ffmpeg.readFile('out.mp4');const bytes=data instanceof Uint8Array?data:new Uint8Array(data);if(!bytes||bytes.length<2048)throw new Error('MP4 vide');try{for(const f of written)await ffmpeg.deleteFile(f).catch(()=>{});await ffmpeg.deleteFile('list.txt').catch(()=>{});await ffmpeg.deleteFile('out.mp4').catch(()=>{});}catch(e){}return new Blob([bytes],{type:'video/mp4'});}
async function assembleScene(bid){const b=P.boards.find(x=>x.id===bid);if(!b)return;if(!lock('asm:'+bid))return toast('Assemblage déjà en cours');try{showAsmStatus('Scène '+bid,0,'');const blob=await assembleList(b.panels);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='xenoscope_'+safeName(bid)+'.mp4';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);showAsmStatus('Terminé',100,fmtSize(blob.size));toast('🎬 Scène '+bid+' ('+fmtSize(blob.size)+')');hideAsmStatus(5000);}catch(e){log('er','Assemblage : '+e.message);toast('❌ '+e.message);showAsmStatus('Échec',0,sanLog(e.message));hideAsmStatus(8000);}finally{unlock('asm:'+bid);}}
async function assembleAll(){if(!lock('asm:all'))return toast('Assemblage déjà en cours');try{const panels=[];for(const b of P.boards)for(const p of b.panels)panels.push(p);if(!panels.length)return toast('Aucune case');showAsmStatus('Film complet',0,'');const blob=await assembleList(panels);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='xenoscope_full_'+P.id+'.mp4';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);showAsmStatus('Terminé',100,fmtSize(blob.size));toast('🎬 Film complet ('+fmtSize(blob.size)+')');hideAsmStatus(6000);}catch(e){log('er','Assemblage : '+e.message);toast('❌ '+e.message);showAsmStatus('Échec',0,sanLog(e.message));hideAsmStatus(8000);}finally{unlock('asm:all');}}
function triggerDownloadUrl(url,filename){try{const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){log('er','Téléchargement échoué');return false;}}
async function dlAssetById(assetId,filename){const blob=await getAssetBlob(assetId);if(!blob)return toast('❌ Image introuvable');const url=URL.createObjectURL(blob);if(triggerDownloadUrl(url,filename)){toast('⬇ '+filename);setTimeout(()=>URL.revokeObjectURL(url),30000);}}
async function dlCharView(cid,vid){const c=findChar(cid);const v=c&&c.views.find(x=>x.id===vid);if(!v||!v.img)return toast('Aucune image');if(v.img.assetId)return dlAssetById(v.img.assetId,charFilename(cid,vid));toast('❌ Indisponible');}
async function dlPanelImg(pid){const f=findPanel(pid);if(!f)return;const p=f.panel;if(!p.img)return toast('Aucune image');if(p.img.assetId)return dlAssetById(p.img.assetId,panelFilename(pid));toast('❌ Indisponible');}
async function filesFromPanels(panels){const out=[];for(const p of panels){if(!p.img||!p.img.assetId)continue;const b=await getAssetBlob(p.img.assetId);if(b)out.push({name:panelFilename(p.id),blob:b});}return out;}
async function dlZip(files,zipName){if(typeof JSZip==='undefined')return toast('JSZip non chargé');if(!files.length)return toast('Aucun fichier');toast('⏳ ZIP ('+files.length+')…');const zip=new JSZip();for(const f of files){if(f.blob)zip.file(f.name,f.blob);}try{const blob=await zip.generateAsync({type:'blob'});const url=URL.createObjectURL(blob);triggerDownloadUrl(url,zipName);setTimeout(()=>URL.revokeObjectURL(url),20000);toast('⬇ '+zipName+' ('+fmtSize(blob.size)+')');}catch(e){toast('Erreur ZIP : '+e.message);}}
async function zipChar(cid){const c=findChar(cid);if(!c)return;const files=[];for(const v of c.views){if(v.img&&v.img.assetId){const b=await getAssetBlob(v.img.assetId);if(b)files.push({name:charFilename(cid,v.id),blob:b});}}if(!files.length)return toast('Aucune image');dlZip(files,'personnage_'+safeName(cid)+'.zip');}
async function zipBoard(bid){const b=P.boards.find(x=>x.id===bid);if(!b)return;const files=await filesFromPanels(b.panels);if(!files.length)return toast('Aucune image');dlZip(files,'scene_'+safeName(bid)+'.zip');}
async function zipAll(){const all=[];for(const c of P.characters){for(const v of c.views){if(v.img&&v.img.assetId){const b=await getAssetBlob(v.img.assetId);if(b)all.push({name:'personnages/'+charFilename(c.id,v.id),blob:b});}}}for(const b of P.boards)for(const p of b.panels){if(p.img&&p.img.assetId){const blob=await getAssetBlob(p.img.assetId);if(blob)all.push({name:'storyboard/'+panelFilename(p.id),blob:blob});}}if(!all.length)return toast('Aucune image');dlZip(all,'xenoscope_images_'+P.id+'.zip');}
async function exportProjectFull(){toast('⏳ Sauvegarde…');try{const zip=new JSZip();const meta={version:10,kind:'xenoscope-full',created:Date.now(),project:JSON.parse(JSON.stringify(P))};for(const c of meta.project.characters||[])for(const v of c.views||[]){if(v.img&&v.img.assetId){v.img._ref='assets/'+v.img.assetId+'.bin';}}for(const b of meta.project.boards||[])for(const p of b.panels||[]){if(p.img&&p.img.assetId){p.img._ref='assets/'+p.img.assetId+'.bin';}}zip.file('project.json',JSON.stringify(meta,null,2));const assetIds=new Set();for(const c of P.characters||[])for(const v of c.views||[])if(v.img&&v.img.assetId)assetIds.add(v.img.assetId);for(const b of P.boards||[])for(const p of b.panels||[])if(p.img&&p.img.assetId)assetIds.add(p.img.assetId);let n=0;for(const id of assetIds){const blob=await getAssetBlob(id);if(blob){zip.file('assets/'+id+'.bin',blob);n++;}}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:1}});const url=URL.createObjectURL(blob);triggerDownloadUrl(url,'xenoscope_save_'+P.id+'.zip');setTimeout(()=>URL.revokeObjectURL(url),60000);log('ok','Sauvegarde · '+n+' assets');toast('💾 Sauvegarde exportée ('+fmtSize(blob.size)+')');}catch(e){log('er','Export : '+e.message);toast('❌ '+e.message);}}
function importProjectFull(file){const fr=new FileReader();fr.onload=async()=>{try{if(typeof JSZip==='undefined')throw new Error('JSZip non chargé');const zip=await JSZip.loadAsync(fr.result);const metaFile=zip.file('project.json');if(!metaFile)throw new Error('project.json absent');const meta=JSON.parse(await metaFile.async('string'));if(!meta.project)throw new Error('Format invalide');const proj=meta.project;const assetMap=new Map();const assetFiles=Object.keys(zip.files).filter(n=>n.startsWith('assets/')&&!zip.files[n].dir);for(const path of assetFiles){const oldId=path.replace('assets/','').replace(/\.(bin|jpg|png|json|txt)$/i,'');let blob=null;try{blob=await zip.files[path].async('blob');}catch(e){}if(!blob){try{const txt=await zip.files[path].async('string');if(txt&&txt.indexOf('data:')===0){const i=txt.indexOf(',');const b64=txt.slice(i+1);const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i2=0;i2<bin.length;i2++)arr[i2]=bin.charCodeAt(i2);blob=new Blob([arr],{type:'image/jpeg'});}}catch(e){}}if(blob){const newId='asset_'+uid()+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const bytes=await blobToBytes(blob);await dbPut('assets',{id:newId,bytes,mime:blob.type||'image/png',size:bytes.length,created:Date.now(),tag:'import'});assetMap.set(oldId,newId);}}for(const c of proj.characters||[])for(const v of c.views||[]){if(v.img&&v.img._ref){const oldId=v.img._ref.replace('assets/','').replace(/\.(bin|jpg|png|json|txt)$/i,'');const newId=assetMap.get(oldId);if(newId)v.img={assetId:newId,size:0,created:Date.now()};else v.img=null;}}for(const b of proj.boards||[])for(const p of b.panels||[]){if(p.img&&p.img._ref){const oldId=p.img._ref.replace('assets/','').replace(/\.(bin|jpg|png|json|txt)$/i,'');const newId=assetMap.get(oldId);if(newId)p.img={assetId:newId,size:0,created:Date.now()};else p.img=null;}}const normalized=normalizeProject(proj);setP(normalized);page=1;refresh();toast('✓ Projet restauré · '+assetMap.size+' image(s)');}catch(e){log('er','Import : '+e.message);toast('❌ '+e.message);}};fr.onerror=()=>toast('❌ Lecture impossible');fr.readAsArrayBuffer(file);}
async function exportProjectMeta(){const clean=JSON.parse(JSON.stringify(P));for(const c of clean.characters||[])for(const v of c.views||[]){if(v.img){v.img={assetId:v.img.assetId||null,note:'médias non intégrés'};}}for(const b of clean.boards||[])for(const p of b.panels||[]){if(p.img)p.img={assetId:p.img.assetId||null,note:'médias non intégrés'};}const json=JSON.stringify(clean,null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);triggerDownloadUrl(url,'xenoscope_meta_'+P.id+'.json');setTimeout(()=>URL.revokeObjectURL(url),10000);toast('JSON exporté');}

function panelCard(board,panel,idx){const isP=(idx===0&&board.id==='S01');const has=!!panel.img;const busy=panel.busy||panel.st==='running';const inQ=panel.st==='queued';return '<div class="cd panel'+(isP?' principal':'')+'">'+'<div class="lab">'+esc(panel.id)+' · '+esc(board.title)+' '+panelStateBadge(panel)+' '+imgStateBadge(panel)+'</div>'+imBox(panel)+'<textarea data-paneldesc="'+panel.id+'" rows="2">'+esc(panel.desc)+'</textarea>'+'<div class="info"><b>Décor</b> '+esc(panel.decor)+' · <b>Cadrage</b> '+esc(panel.framing)+' · <b>Action</b> '+esc(panel.action)+'</div>'+'<textarea data-panelimgprompt="'+panel.id+'" rows="2">'+esc(panel.imgPrompt)+'</textarea>'+'<div class="rw"><span class="lab">Durée : '+panel.duration+'s</span>'+'<button class="sm ghost" data-a="panel-dur" data-id="'+panel.id+'" data-d="3">3s</button>'+'<button class="sm ghost" data-a="panel-dur" data-id="'+panel.id+'" data-d="5">5s</button>'+'<button class="sm ghost" data-a="panel-dur" data-id="'+panel.id+'" data-d="8">8s</button>'+'<button class="sm ghost" data-a="panel-dur" data-id="'+panel.id+'" data-d="10">10s</button>'+'<button class="sm ghost" data-a="panel-dur" data-id="'+panel.id+'" data-d="12">12s</button></div>'+'<div class="rw"><button class="sm ghost" data-a="panel-chars" data-id="'+panel.id+'">👥 ('+panel.chars.length+')</button></div>'+'<div class="rw">'+btn('panel-img','↻ Image','sm','data-id="'+panel.id+'" '+(busy?'disabled':''))+(busy?btn('abort','■','sm ghost','data-key="panel:'+panel.id+'"'):'')+btn('panel-queue','+ File','sm ghost','data-id="'+panel.id+'" '+(inQ?'disabled':'') )+btn('panel-dl','⬇ Image','sm ghost','data-id="'+panel.id+'" '+(has?'':'disabled'))+'<label class="sm btn ghost" style="cursor:pointer">⬆<input type="file" accept="image/*" hidden data-uppanel="'+panel.id+'"></label>'+btn('panel-del','🗑','sm ghost','data-id="'+panel.id+'"')+'</div>'+(panel.err?'<div class="lab" style="color:var(--er);margin-top:4px">'+esc(panel.err)+'</div>':'')+'</div>';}
function boardCard(board){const panels=board.panels||[];const done=panels.filter(p=>p.img&&p.img.assetId).length;const total=panels.length;const allDone=done===total&&total>0;return '<div class="cd"><h3>'+esc(board.id)+' — '+esc(board.title)+' <span class="badge">'+total+'</span><span class="badge ok">'+done+' img</span></h3>'+'<input type="text" data-boardtitle="'+board.id+'" value="'+esc(board.title)+'">'+'<div class="grid" style="margin-top:10px">'+panels.map((p,i)=>panelCard(board,p,i)).join('')+'</div>'+'<div class="rw" style="margin-top:10px">'+btn('panel-add','+ Case','sm','data-bid="'+board.id+'"')+btn('board-zip','⬇ ZIP','sm gold','data-bid="'+board.id+'" '+(done>0?'':'disabled'))+btn('board-asm','🎬 Scène','sm gold','data-bid="'+board.id+'" '+(allDone?'':'disabled'))+btn('board-del','🗑 Planche','sm ghost','data-bid="'+board.id+'"')+'</div>'+'</div>';}

async function hydrateImages(){
  const boxes=document.querySelectorAll('.im[data-aid]');
  for(const el of boxes){
    const aid=el.dataset.aid;
    if(!aid)continue;
    try{
      const blob=await getAssetBlob(aid);
      if(!blob){el.innerHTML='<span style="color:var(--er)">image introuvable</span>';continue;}
      const url=URL.createObjectURL(blob);
      const im=new Image();
      im.alt='';
      im.onload=()=>{try{URL.revokeObjectURL(url);}catch(e){}el.innerHTML='';el.appendChild(im);};
      im.onerror=()=>{try{URL.revokeObjectURL(url);}catch(e){}el.innerHTML='<span style="color:var(--er)">affichage échoué</span>';log('er','Affichage '+aid+' échoué (blob type='+blob.type+', taille='+blob.size+')');};
      el.innerHTML='<span>chargement…</span>';
      im.src=url;
    }catch(e){el.innerHTML='<span style="color:var(--er)">erreur</span>';log('er','hydrate '+aid+' : '+e.message);}
  }
}

VIEW.step2=()=>'<div class="hero">'+hd(3,'<b>Storyboard</b>')+guide('👉 Génération par lots de <b>'+MAX_BATCH+'</b>.','gd')+P.boards.map(boardCard).join('')+'<div class="rw" style="margin-top:10px">'+btn('board-add','+ Planche','')+'</div>'+'<div class="rw" style="margin-top:14px">'+btn('q-all','🚀 Générer les images manquantes (lot de '+MAX_BATCH+')','big gold')+'</div>'+foot(btn('go','← Précédent','ghost','data-n="1"'),nextBtn('go','Passer à la production','data-n="3"'))+'</div>';
VIEW.step3=()=>{const panels=[];for(const b of P.boards)for(const p of b.panels)panels.push(p);const total=panels.length;const done=panels.filter(p=>p.img&&p.img.assetId).length;const missing=total-done;const totalSec=panels.reduce((s,p)=>s+(p.duration||5),0);const allDone=done===total&&total>0;return '<div class="hero">'+hd(4,'Production <b>et assemblage</b>')+guide('👉 ffmpeg.wasm Ken Burns 1080×1920 30 FPS.','gd')+'<div class="info"><b>'+total+'</b> cases · <b>'+totalSec+'</b> s · images : <b>'+done+'/'+total+'</b> · manquantes : <b>'+missing+'</b></div>'+P.boards.map(boardCard).join('')+'<div class="rw" style="margin-top:14px">'+btn('export-full','💾 Sauvegarde complète','big gold')+btn('export-meta','⬇ JSON méta','sm')+'<label class="sm btn" style="cursor:pointer">⬆ Restaurer<input type="file" accept=".zip" hidden id="importFullFile"></label>'+btn('zip-all','⬇ ZIP images','sm')+'<label class="sm btn" style="cursor:pointer">⬆ JSON<input type="file" accept=".json" hidden id="importMetaFile"></label>'+'</div>'+'<div class="assembly-zone">'+'<div class="lab">🎬 Assemblage MP4</div>'+'<div class="info">1080×1920 · 30 FPS · H.264. '+'<b>'+done+'/'+total+'</b> images.</div>'+'<div class="rw">'+btn('asm-all','▶ Assembler le film complet','big gold',(allDone?'':'disabled'))+'</div>'+(missing?'<div class="info" style="color:var(--b)">⚠️ '+missing+' image(s) manquante(s).</div>':'')+'</div>'+foot(btn('go','← Précédent','ghost','data-n="2"'))+'</div>';};
async function renderView(){if(!P)return;P.max=Math.max(P.max||0,page);P.page=page;const stepsHtml=STEPS.map((s,i)=>{const can=i!==page&&(i===0||(KEYS.list.length&&i<=P.max));return '<button class="st '+(i===page?'on':can?'ok':'')+'" '+(can?'data-a="go" data-n="'+i+'"':'disabled')+'>'+(i+1)+'. '+s+'</button>';}).join('');$('#steps').innerHTML=stepsHtml;const fn=VIEW['step'+page]||VIEW.step0;let html='';try{html=await fn();}catch(e){html='<div class="hero">'+guide('Erreur : '+esc(e.message),'er')+'</div>';}$('#main').innerHTML=html;if(page===0)keysChips();renderQueueBanner();hydrateImages();}
function refresh(){renderView();refreshQui();}
function refreshQui(){const c=$('#qchip');if(!c||!P)return;const s=getQueueStats();c.textContent='IMG '+s.done+'/'+s.total+(s.queued?' · '+s.queued+' en file':'')+(s.running?' · '+s.running+' en cours':'')+(s.error?' · '+s.error+' err':'');c.className='chip '+(s.done===s.total&&s.total?'':'off');}
function keysChips(){const e=$('#kl');if(!e)return;e.innerHTML=KEYS.list.map((k,i)=>'<span class="chip '+(k.off?'off':'')+'">#'+(i+1)+' …'+esc(k.k.slice(-4))+'</span>').join('');}
function confirmModal(title,rows,onConfirm,label){const inner=$('#modalInner');inner.innerHTML='<h3>'+esc(title)+'</h3>'+rows.map(r=>'<div class="kv"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('')+'<div class="guide gd" style="margin-top:14px"><div>⚠️ Confirme pour lancer.</div></div>'+'<div class="rw" style="justify-content:flex-end">'+btn('modal-cancel','Annuler','ghost')+' '+btn('modal-ok',label||'Confirmer','big')+'</div>';$('#modal').classList.add('on');const close=()=>$('#modal').classList.remove('on');inner.querySelector('[data-a="modal-cancel"]').onclick=close;inner.querySelector('[data-a="modal-ok"]').onclick=()=>{close();onConfirm();};}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');});
async function onClick(e){const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='go'){await flushSave();page=+b.dataset.n;refresh();return;}
if(a==='con'){$('#con').classList.toggle('on');return;}
if(a==='togglekey'){KEYS.revealed=!KEYS.revealed;refresh();return;}
if(a==='savekeys'){const ks=Array.from(new Set(($('#keyInput').value||'').split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=8)));if(!ks.length)return toast('Colle une clé');const pv=($('#proxyInput').value||'').trim();if(!pv)return toast('URL proxy manquante');PROXY=pv;KEYS.plan=$('#plan').value;KEYS.list=ks.map(k=>mkKey(k));await dbPut('config',{key:'keys',list:ks,plan:KEYS.plan,proxy:PROXY});toast('✓ '+ks.length+' clé(s)');page=1;refresh();return;}
if(a==='clearkeys'){if(!confirm('Effacer la clé ?'))return;KEYS.list=[];KEYS.revealed=false;await dbDel('config','keys');toast('Clé effacée');refresh();return;}
if(a==='abort'){const k=b.dataset.key;if(k){abortTask(k);log('wr','Annulation : '+k);toast('Annulation…');}return;}
if(a==='setprincipal'){const c=findChar(b.dataset.cid);if(!c)return;c.principalViewId=b.dataset.vid;save();refresh();return;}
if(a==='gencharview'){if(!KEYS.list.length)return toast('Enregistre ta clé API');confirmModal('Générer une vue',[['Modèle',IMG],['Format','1:1'],['Personnage',b.dataset.cid],['Vue',b.dataset.vid]],()=>genCharView(b.dataset.cid,b.dataset.vid),'Générer');return;}
if(a==='dlcharview'){dlCharView(b.dataset.cid,b.dataset.vid);return;}
if(a==='dlcharbundle'){zipChar(b.dataset.cid);return;}
if(a==='panel-dur'){const f=findPanel(id);if(f){f.panel.duration=+b.dataset.d;save();refresh();}return;}
if(a==='panel-chars'){const f=findPanel(id);if(!f)return;const inner=$('#modalInner');inner.innerHTML='<h3>Personnages — '+esc(id)+'</h3>'+P.characters.map(c=>{const ck=f.panel.chars.indexOf(c.id)>=0?'checked':'';return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" data-charpick="'+c.id+'" '+ck+'><span>'+esc(c.name)+'</span></label>';}).join('')+'<div class="info">Limite : <b>'+MAX_REF+'</b></div>'+'<div class="rw" style="justify-content:flex-end;margin-top:10px">'+btn('modal-cancel','Fermer','ghost')+'</div>';$('#modal').classList.add('on');inner.querySelector('[data-a="modal-cancel"]').onclick=()=>{const ck=Array.from(inner.querySelectorAll('[data-charpick]')).filter(x=>x.checked).map(x=>x.dataset.charpick);f.panel.chars=ck;save();$('#modal').classList.remove('on');refresh();};return;}
if(a==='panel-img'){if(!KEYS.list.length)return toast('Enregistre ta clé API');confirmModal('Générer l\'image de '+id,[['Modèle',IMG],['Format',P.ratio]],()=>genPanelImg(id),'Générer');return;}
if(a==='retry-panel'){genPanelImg(id);return;}
if(a==='panel-queue'){const f=findPanel(id);if(!f)return;f.panel.st='queued';save();refresh();if(!QUEUE.running)processQueue();return;}
if(a==='panel-dl'){dlPanelImg(id);return;}
if(a==='panel-add'){const board=P.boards.find(x=>x.id===b.dataset.bid);if(!board)return;const n=board.panels.length+1;const newId=board.id+'_P'+String(n).padStart(2,'0');board.panels.push(newPanel({id:newId,desc:'Nouvelle case'}));save();refresh();return;}
if(a==='panel-del'){const f=findPanel(id);if(!f)return;if(!confirm('Supprimer '+id+' ?'))return;if(f.panel.img&&f.panel.img.assetId)await deleteAsset(f.panel.img.assetId);f.board.panels=f.board.panels.filter(x=>x.id!==id);save();refresh();return;}
if(a==='board-add'){const n=P.boards.length+1;const newId='S'+String(n).padStart(2,'0');P.boards.push({id:newId,title:'Nouvelle scène',panels:[newPanel({id:newId+'_P01',desc:'Nouvelle case'})]});save();refresh();return;}
if(a==='board-del'){if(!confirm('Supprimer la planche '+b.dataset.bid+' ?'))return;const bd=P.boards.find(x=>x.id===b.dataset.bid);if(bd)for(const p of bd.panels)if(p.img&&p.img.assetId)await deleteAsset(p.img.assetId);P.boards=P.boards.filter(x=>x.id!==b.dataset.bid);save();refresh();return;}
if(a==='board-zip'){zipBoard(b.dataset.bid);return;}
if(a==='board-asm'){assembleScene(b.dataset.bid);return;}
if(a==='q-all'){if(!KEYS.list.length)return toast('Enregistre ta clé API');enqueueAllMissing();return;}
if(a==='q-pause'){QUEUE.abort=!QUEUE.abort;if(!QUEUE.abort&&!QUEUE.running)processQueue();refresh();return;}
if(a==='q-clear'){const s=getQueueStats();for(const p of s.list)if(p.st==='queued')p.st='idle';save();refresh();return;}
if(a==='asm-all'){assembleAll();return;}
if(a==='export-full'){exportProjectFull();return;}
if(a==='export-meta'){exportProjectMeta();return;}
if(a==='zip-all'){zipAll();return;}
if(a==='sess'){sessions();return;}
if(a==='new'){await flushSave();setP(newP());page=KEYS.list.length?1:0;const m=$('#md');if(m)m.remove();refresh();return;}
}
document.addEventListener('click',e=>{onClick(e).catch(er=>{log('er','action : '+(er.message||er));});});
document.addEventListener('input',e=>{const t=e.target;if(!P)return;if(t.dataset.chardesc){const c=findChar(t.dataset.chardesc);if(c){c.desc=t.value;save();}return;}if(t.dataset.charbible){const c=findChar(t.dataset.charbible);if(c){c.bible=t.value;save();}return;}if(t.dataset.charPrompt){const parts=t.dataset.charPrompt.split('/');const v=findView(parts[0],parts[1]);if(v){v.prompt=t.value;save();}return;}if(t.dataset.paneldesc){const f=findPanel(t.dataset.paneldesc);if(f){f.panel.desc=t.value;save();}return;}if(t.dataset.panelimgprompt){const f=findPanel(t.dataset.panelimgprompt);if(f){f.panel.imgPrompt=t.value;save();}return;}if(t.dataset.boardtitle){const b=P.boards.find(x=>x.id===t.dataset.boardtitle);if(b){b.title=t.value;save();}return;}});
document.addEventListener('change',async e=>{const t=e.target;if(!P)return;if(t.id==='importFullFile'){const f=t.files[0];if(f)importProjectFull(f);return;}if(t.id==='importMetaFile'){const f=t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(fr.result);if(!data||(!data.characters&&!data.boards))throw new Error('Structure invalide');const norm=normalizeProject(data);setP(norm);page=1;refresh();toast('✓ JSON importé');}catch(err){toast('❌ '+err.message);}};fr.readAsText(f);return;}if(t.dataset.upview){const parts=t.dataset.upview.split('/');const v=findView(parts[0],parts[1]);if(!v)return;const f=t.files[0];if(!f)return;try{if(v.img&&v.img.assetId)await deleteAsset(v.img.assetId);const id=await saveAssetFromBlob(f,f.type||'image/png','upload');v.img={assetId:id,size:f.size,created:Date.now()};await flushSave();refresh();toast('✓ Image importée');}catch(err){toast('❌ '+err.message);}return;}if(t.dataset.uppanel){const f=findPanel(t.dataset.uppanel);if(!f)return;const file=t.files[0];if(!file)return;try{if(f.panel.img&&f.panel.img.assetId)await deleteAsset(f.panel.img.assetId);const id=await saveAssetFromBlob(file,file.type||'image/png','upload');f.panel.img={assetId:id,size:file.size,created:Date.now()};f.panel.st='ok';await flushSave();refresh();toast('✓ Image importée');}catch(err){toast('❌ '+err.message);}return;}});
async function sessions(){let md=$('#md');if(!md){document.body.insertAdjacentHTML('beforeend','<div id="md" class="modal on"><div class="modal-inner" id="mdc"></div></div>');md=$('#md');}const list=(await dbAll('projects')).sort((a,b)=>(b.upd||0)-(a.upd||0));const html='<h3>Mes projets</h3>'+'<div class="rw">'+btn('new','+ Nouveau projet','')+btn('closemd','Fermer','sm ghost')+'</div>'+list.map(p=>{const panels=[];for(const b of (p.boards||[]))for(const x of (b.panels||[]))panels.push(x);const imgs=panels.filter(x=>x.img&&x.img.assetId).length;return '<div class="cd" style="margin-top:8px"><b>'+esc(p.title||'Projet')+'</b>'+'<div class="lab">'+new Date(p.upd||0).toLocaleString('fr-FR')+' · '+(p.boards||[]).length+' planches · '+panels.length+' cases · '+imgs+' img</div>'+'<div class="rw">'+btn('open','Ouvrir','sm','data-id="'+p.id+'"')+btn('delsess','Supprimer','sm ghost','data-id="'+p.id+'"')+'</div></div>';}).join('');$('#mdc').innerHTML=html;}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;if(a==='closemd'){const m=$('#md');if(m)m.remove();return;}if(a==='open'){await flushSave();const p=await dbGet('projects',id);if(!p)return;setP(p);page=KEYS.list.length?1:0;const m=$('#md');if(m)m.remove();refresh();return;}if(a==='delsess'){if(!confirm('Supprimer ce projet et ses images ?'))return;const p=await dbGet('projects',id);if(p){for(const c of p.characters||[])for(const v of c.views||[])if(v.img&&v.img.assetId)await deleteAsset(v.img.assetId);for(const bd of p.boards||[])for(const pn of bd.panels||[])if(pn.img&&pn.img.assetId)await deleteAsset(pn.img.assetId);}await dbDel('projects',id);const m=$('#md');if(m)m.remove();sessions();return;}});
(async()=>{try{db=await Promise.race([openDB(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('délai')),3000))]);}catch(e){db=null;fall();}try{const k=await dbGet('config','keys');if(k){KEYS.plan=k.plan||'free';KEYS.list=(k.list||[]).map(mkKey);if(k.proxy)PROXY=k.proxy;}const last=await dbGet('config','last');const p=last?await dbGet('projects',last.v):null;setP(p||newP());}catch(e){setP(newP());}page=KEYS.list.length?Math.max(1,Math.min(P.page||1,3)):0;await refresh();try{await migrateProjectAssets();}catch(e){}const nbPanels=P.boards.reduce((s,b)=>s+b.panels.length,0);log('in','Xenoscope Studio prêt · '+P.boards.length+' planches · '+nbPanels+' cases · IndexedDB : '+(mode==='idb'?'OK':'fallback'));updateStorageChip();setSaveState('saved');const s=getQueueStats();let requeued=0;for(const p of s.list){if(p.st==='running'){p.st='queued';requeued++;}}if(requeued){await flushSave();refresh();}const s2=getQueueStats();if(s2.queued>0)renderQueueBanner();})();
</script></body></html>
