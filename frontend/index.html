<style>

<script>

const AGNES_API=AGNES_BASE+'/v1';
const AGNES_POLL=AGNES_BASE+'/agnesapi';

const STEPS=['Clé API','Personnages','Storyboard','Production'];

const SCENE_STYLE='cinematic sci-fi, deep blue-violet palette with golden accents, volumetric realistic lighting, ultra-detailed, photorealistic, 8K, contemplative atmosphere';

const POLL_TIMEOUT_MS=15*60*1000;

const sanLog=s=>{if(!s)return '';let out=String(s);out=out.replace(/sk-[A-Za-z0-9_\-]{6,}/g,'sk-***');out=out.replace(/Bearer\s+[A-Za-z0-9_\-\.]{6,}/gi,'Bearer ***');return out.slice(0,180);};

const CHAR_DEFAULTS=[

  {id:'mere',name:'La Mère',bible:'the mother: adult female humanoid alien, subtle blue-grey skin, luminous amber eyes, dark garments with gold trim, attentive and caring expression',desc:'Extraterrestre humanoïde adulte femelle, peau bleu-gris subtile, yeux ambrés lumineux, traits extraterrestres réalistes mais élégants, vêtements sombres avec liserés dorés, expression attentive et bienveillante'},
  {id:'enfant',name:'L\'Enfant',bible:'the child: young humanoid alien, subtle blue-grey skin, very luminous amber eyes, dark garments with gold trim, curiosity and wonder',desc:'Extraterrestre humanoïde enfant, peau bleu-gris subtile, yeux ambrés très lumineux, traits extraterrestres réalistes, vêtements sombres avec liserés dorés, curiosité et émerveillement'}

const VIEW_DEFS=[

  {id:'profil',label:'Profil',en:'side profile view head and shoulders'},
  {id:'dos',label:'Dos',en:'back view head and shoulders'},
  {id:'pied_face',label:'Pied face',en:'full body standing pose, front view'},
  {id:'pied_tq',label:'Pied trois-quarts',en:'full body standing pose, three-quarter view'}

const BOARDS_DEFAULTS=[
  {id:'S01',title:'La Terre depuis l\'espace',panels:[
    {id:'S01_P01',desc:'Vue large de la Terre depuis l\'espace',chars:[],decor:'Espace profond',framing:'Plan large fixe',action:'Rotation très lente',imgPrompt:'Cinematic wide shot of planet Earth from deep space, deep blue oceans, visible continents, glowing atmosphere, starry background',animPrompt:'Slow rotation of the Earth, clouds drifting naturally, subtle camera drift',duration:4},
    {id:'S01_P02',desc:'Approche vers l\'atmosphère, nuages en mouvement',chars:[],decor:'Espace proche',framing:'Zoom avant lent',action:'La caméra avance',imgPrompt:'Cinematic close approach to Earth atmosphere, white clouds drifting slowly, blue oceans below, sunlight glinting on water',animPrompt:'Slow forward push toward Earth, clouds drifting',duration:4},
    {id:'S01_P03',desc:'Recul, silhouette sombre au premier plan',chars:[],decor:'Espace',framing:'Travelling arrière',action:'Révélation partielle',imgPrompt:'Cinematic pull back from Earth, dark silhouette barely visible in foreground, deep space, stars, mysterious mood',animPrompt:'Slow camera pull back, mysterious silhouette entering frame',duration:4}
  ]},
  {id:'S02',title:'L\'appareil d\'observation',panels:[
    {id:'S02_P01',desc:'Plan large du jardin extraterrestre',chars:[],decor:'Jardin extraterrestre',framing:'Plan large',action:'Présentation du décor',imgPrompt:'Cinematic wide shot of an alien garden at dusk, strange bioluminescent vegetation, a cylindrical observation device at the center, blue-violet tones with golden accents',animPrompt:'Slow camera drift, plant leaves gently moving, device softly humming',duration:4},
    {id:'S02_P02',desc:'Gros plan de l\'appareil, symboles pulsant',chars:[],decor:'Appareil avancé',framing:'Macro',action:'Symboles pulsent',imgPrompt:'Extreme close-up of an advanced alien observation device, glowing blue and gold symbols pulsing on metallic and crystalline surfaces',animPrompt:'Glowing symbols pulsing slowly, subtle light reflections',duration:4},
    {id:'S02_P03',desc:'Le dôme s\'ouvre, sphère de verre avec la Terre',chars:[],decor:'Appareil ouvert',framing:'Plan rapproché',action:'Ouverture mécanique',imgPrompt:'Cinematic shot of an alien device opening, revealing a glass sphere inside showing a miniature Earth, glowing edge lights',animPrompt:'Mechanical opening motion, miniature Earth slowly rotating inside',duration:4},
    {id:'S02_P04',desc:'Reflet de la Terre dans l\'appareil',chars:[],decor:'Appareil',framing:'Insert',action:'Reflet qui tourne',imgPrompt:'Insert shot, reflection of Earth in the polished crystalline surface of an alien device, blue and gold light',animPrompt:'Earth reflection slowly rotating, light shifting on crystalline surface',duration:4}
  ]},
  {id:'S03',title:'La famille extraterrestre',panels:[
    {id:'S03_P01',desc:'Le père entre dans le cadre',chars:['pere'],decor:'Jardin extraterrestre',framing:'Plan moyen',action:'Entrée du père',imgPrompt:'Cinematic medium shot, alien father entering frame, looking up at observation device, alien garden',animPrompt:'Father walking into frame slowly, subtle head turn',duration:4},
    {id:'S03_P02',desc:'La mère rejoint le père',chars:['pere','mere'],decor:'Jardin extraterrestre',framing:'Plan moyen',action:'Arrivée de la mère',imgPrompt:'Cinematic medium shot, alien mother joining the father near the observation device',animPrompt:'Mother stepping into frame, gentle hand gesture',duration:4},
    {id:'S03_P03',desc:'L\'enfant se glisse entre ses parents',chars:['pere','mere','enfant'],decor:'Jardin extraterrestre',framing:'Plan moyen',action:'Entrée de l\'enfant',imgPrompt:'Cinematic medium shot, alien child stepping between parents, curious expression, glowing observation device nearby',animPrompt:'Child stepping between parents, slight upward look',duration:4},
    {id:'S03_P04',desc:'Plan large des trois devant l\'appareil',chars:['pere','mere','enfant'],decor:'Jardin extraterrestre',framing:'Plan large',action:'Pose contemplative',imgPrompt:'Cinematic wide shot, alien family of three standing before a glowing observation device showing Earth',animPrompt:'Family standing still, device glowing, slow camera pull back',duration:4}
  ]},
  {id:'S04',title:'Observation des humains',panels:[
    {id:'S04_P01',desc:'Silhouettes humaines dans la sphère',chars:[],decor:'Écran de la sphère',framing:'Insert',action:'Silhouettes qui bougent',imgPrompt:'Insert shot of an alien glass sphere showing a holographic miniature of human city life, tiny silhouettes moving',animPrompt:'Human silhouettes moving inside the sphere, subtle glow pulsing',duration:4},
    {id:'S04_P02',desc:'Réaction du père, sourcils froncés',chars:['pere'],decor:'Jardin extraterrestre',framing:'Gros plan visage',action:'Réaction silencieuse',imgPrompt:'Close-up of alien father face, subtle frown of curiosity, glowing device reflected in amber eyes',animPrompt:'Subtle facial expression shift, slow blink',duration:4},
    {id:'S04_P03',desc:'La mère pose la main sur l\'épaule du père',chars:['pere','mere'],decor:'Jardin extraterrestre',framing:'Plan rapproché',action:'Geste de réconfort',imgPrompt:'Cinematic close-up, alien mother\'s hand gently resting on father\'s shoulder, both watching the glowing observation sphere',animPrompt:'Hand slowly settling on shoulder, subtle breathing motion',duration:4},
    {id:'S04_P04',desc:'L\'enfant pointe la sphère',chars:['enfant'],decor:'Jardin extraterrestre',framing:'Plan moyen',action:'Geste de l\'enfant',imgPrompt:'Cinematic medium shot, alien child pointing at the glowing observation sphere, curious expression',animPrompt:'Child slowly extending arm to point, head tilting slightly',duration:4},
    {id:'S04_P05',desc:'Échange de regards entre les trois',chars:['pere','mere','enfant'],decor:'Jardin extraterrestre',framing:'Plan serré',action:'Regards croisés',imgPrompt:'Cinematic tight shot of an alien family of three exchanging silent looks, observation device glowing softly behind',animPrompt:'Subtle head turns, eyes meeting, calm breathing',duration:4}
  ]}
];

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');
const safeName=s=>String(s||'').toLowerCase().replace(/[^a-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
const frErr=(code,msg)=>(ERR_FR[code]||('Erreur HTTP '+code))+(msg?(' — '+sanLog(String(msg)).slice(0,100)):'');

let db=null,P=null,page=0,F=1,saveTimer=null,savePending=false;
let PROXY=DEFAULT_PROXY;
const KEYS={list:[],plan:'free',revealed:false};
const AR=()=>((P&&P.ratio)||'9:16').replace(':','/');
const ref=i=>i&&(i.d||i.u);
const mkKey=k=>({k,img:0,vid:0,cool:0,bad:0,off:false});
const LOCKS=new Set();
const lock=id=>{if(LOCKS.has(id))return false;LOCKS.add(id);return true;};
const unlock=id=>LOCKS.delete(id);
const ABORTS=new Map();
const registerAbort=id=>{const c=new AbortController();ABORTS.set(id,c);return c;};
const clearAbort=id=>ABORTS.delete(id);
const abortTask=id=>{const c=ABORTS.get(id);if(c&&!c.signal.aborted)c.abort();};
const PX=u=>PROXY+encodeURIComponent(u);
const PROXY_VIDEO=()=>PROXY.replace('/api/proxy?url=','/api/proxy/videos');
const PROXY_AGNESAPI=()=>PROXY.replace('/api/proxy?url=','/api/proxy/agnesapi');

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('xenoscope_v2',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'})}});}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
let mode='idb';
const mem={projects:{},config:{}};
const lsK=(s,k)=>'xeno2_'+s+'_'+k;
function fall(){if(mode==='idb'){mode='ls';log('wr','IndexedDB indisponible → localStorage');}}
async function dbGet(s,k){if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.get(k));}catch(e){fall();}}try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v);}catch(e){}return mem[s][k];}
async function dbPut(s,v){const k=v.key||v.id;mem[s][k]=v;if(db&&mode==='idb'){try{return await tx(s,'readwrite',o=>o.put(v));}catch(e){fall();}}try{localStorage.setItem(lsK(s,k),JSON.stringify(v));return true;}catch(e){log('er','localStorage plein');toast('⚠️ Sauvegarde impossible');return false;}}
async function dbDel(s,k){delete mem[s][k];if(db&&mode==='idb'){try{return await tx(s,'readwrite',o=>o.delete(k));}catch(e){fall();}}try{localStorage.removeItem(lsK(s,k));}catch(e){}}
async function dbAll(s){if(db&&mode==='idb'){try{return await tx(s,'readonly',o=>o.getAll());}catch(e){fall();}}const o=Object.assign({},mem[s]);try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.startsWith(lsK(s,''))){const v=JSON.parse(localStorage.getItem(n));o[v.key||v.id]=v;}}}catch(e){}return Object.values(o);}
function save(){if(!P)return;savePending=true;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{P.upd=Date.now();savePending=false;await dbPut('projects',P).catch(e=>log('er','sauvegarde : '+e.message));},400);}
async function flushSave(){if(!savePending||!P)return;clearTimeout(saveTimer);savePending=false;P.upd=Date.now();await dbPut('projects',P).catch(e=>log('er','sauvegarde : '+e.message));}
function log(l,m){const d=document.createElement('div');d.className='lg '+l;d.textContent=new Date().toLocaleTimeString('fr-FR')+'  '+sanLog(m);const b=$('#lb');if(!b)return;b.appendChild(d);while(b.children.length>500)b.firstChild.remove();b.scrollTop=b.scrollHeight;}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200);}

async function slot(kind){
  for(;;){
    let live=KEYS.list.filter(o=>!o.off);
    if(!live.length&&KEYS.list.length){KEYS.list.forEach(o=>{o.off=false;o.bad=0;o.cool=0;});live=KEYS.list;}
    if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const rpm=RPM[KEYS.plan][kind]||10;
    const iv=60000/rpm*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){const t=Math.max(o[kind]||0,o.cool||0,now);if(t<bt){bt=t;best=o;}}
    if(bt>now){await sleep(Math.min(bt-now,400));continue;}
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;
    return best;
  }
}
async function callApi(kind,url,body,signal,method){
  method=method||'POST';
  let lastErr=null;
  for(let a=0;a<3;a++){
    const o=await slot(kind);
    try{
      const opt={method:method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+o.k}};
      if(body&&method==='POST')opt.body=JSON.stringify(body);
      if(signal)opt.signal=signal;
      const r=await fetch(url,opt);
      if(r.ok){o.bad=0;F=Math.max(1,F*0.97);return r;}
      const t=await r.text().catch(()=>'');
      log('er','HTTP '+r.status+' '+sanLog(t));
      if(r.status===429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||30)*1000;F=Math.min(4,F*1.5);lastErr=new Error(frErr(429));continue;}
      if(r.status===401){o.bad++;if(o.bad>=2)o.off=true;lastErr=new Error(frErr(401));continue;}
      if(r.status>=500){lastErr=new Error(frErr(r.status));await sleep(2500*Math.pow(2,a));continue;}
      throw Object.assign(new Error(frErr(r.status,t)),{fatal:true});
    }catch(e){
      if(e.name==='AbortError')throw e;
      if(e.fatal)throw e;
      lastErr=e;await sleep(1500*(a+1));
    }
  }
  throw lastErr||new Error('Échec réseau');
}

function toData(u){return new Promise(resolve=>{if(!u)return resolve(null);if(u.indexOf('data:')===0)return resolve(u);fetch(u).then(r=>r.blob()).then(b=>{const o=URL.createObjectURL(b),im=new Image();im.onload=()=>{try{const s=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(o);resolve(c.toDataURL('image/jpeg',0.86));}catch(e){URL.revokeObjectURL(o);resolve(null);}};im.onerror=()=>{URL.revokeObjectURL(o);resolve(null);};im.src=o;}).catch(()=>resolve(null));});}
function ensureRef(img){if(!img)return Promise.resolve(null);if(img.d)return Promise.resolve(img.d);if(img._conv)return img._conv;img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d;}).catch(()=>{img.d=img.u;return img.d;});return img._conv;}
async function mkImg(prompt,refUris,ratio,signal){
  const body={model:IMG,prompt:san(prompt),n:1,size:'1K',ratio:ratio||(P?P.ratio:'9:16'),extra_body:{response_format:'url'}};
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,MAX_REF);
  const r=await callApi('img',PX(AGNES_API+'/images/generations'),body,signal);
  const d=await r.json();
  const it=d.data&&d.data[0];
  const u=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
  if(!u)throw new Error('Aucune image reçue');
  const img={u:u,d:u.indexOf('data:')===0?u:null};
  if(!img.d)img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d;}).catch(()=>{img.d=u;return img.d;});
  return img;
}

async function mkVideo(panel,imgUrl,signal){

  if(!videoId)throw new Error('Pas de video_id renvoyé par l\'API');
  log('ok','Tâche vidéo créée : '+String(videoId).slice(0,20)+'…');

async function pollVideo(panel,context){
  const {videoId,model}=context;
  const end=Date.now()+POLL_TIMEOUT_MS;
  let attempt=0,consecutiveFailures=0;
  panel.vst='run';panel.vidProgress=0;refresh();
  while(Date.now()<end){
    if(ABORTS.get(panel.id)&&ABORTS.get(panel.id).signal.aborted)throw new Error('aborted');
    attempt++;
    await sleep(POLL_INTERVAL_MS);
    try{
      const o=KEYS.list.filter(k=>!k.off)[0];
      if(!o)throw new Error('Aucune clé active');
      const pollUrl=PROXY_AGNESAPI()+'?video_id='+encodeURIComponent(videoId)+'&model_name='+encodeURIComponent(model);
      const opt={method:'GET',headers:{'Authorization':'Bearer '+o.k}};
      if(ABORTS.get(panel.id))opt.signal=ABORTS.get(panel.id).signal;
      const r=await fetch(pollUrl,opt);
      if(!r.ok){
        consecutiveFailures++;
        if(consecutiveFailures>=10)throw new Error('Suivi impossible après 10 erreurs');
        await sleep(2500);continue;
      }
      const d=await r.json();
      const status=String(d.status||'').toLowerCase();
      const progress=parseInt(d.progress)||0;
      panel.vidProgress=progress;
      if(attempt%5===0)log('in','Polling '+panel.id+' #'+attempt+' · status='+status+' · '+progress+'%');
      refreshQui();
      if(status==='completed'){
        const url=d.url||d.video_url||(d.data&&(d.data.url||d.data.video_url))||(d.metadata&&(d.metadata.url||d.metadata.video_url));
        if(!url)throw new Error('Statut completed mais aucune URL renvoyée');
        return url;
      }
      if(status==='failed'){
        const errMsg=(d.error&&d.error.message)||d.error||'Échec côté serveur';
        throw new Error(sanLog(String(errMsg)).slice(0,200));
      }
      consecutiveFailures=0;
    }catch(e){
      if(e.name==='AbortError')throw e;
      if(e.message==='aborted')throw e;
      log('er','Polling '+panel.id+' : '+e.message);
      consecutiveFailures++;
      if(consecutiveFailures>=15)throw new Error('Trop d\'échecs de polling');
    }
  }
  throw new Error('Délai de génération dépassé (15 min)');
}
async function launchVideo(pid){
  if(!KEYS.list.length)return toast('Enregistre d\'abord ta clé API');
  const f=findPanel(pid);if(!f)return;
  const p=f.panel;
  if(!p.img)return toast('Génère d\'abord l\'image');
  if(!lock(pid))return toast('Opération déjà en cours');
  const imgUrl=p.img.d||p.img.u;
  if(!imgUrl){unlock(pid);return toast('Image sans données');}
  if(imgUrl.indexOf('http')!==0){try{p.img.d=await ensureRef(p.img);}catch(e){}}
  const ctrl=registerAbort(pid);
  p.vst='run';p.err='';refresh();
  try{
    const context=await mkVideo(p,p.img.d||imgUrl,ctrl.signal);
    p.task=context;
    const url=await pollVideo(p,context);
    p.video=url;p.vst='ok';p.err='';p.vidProgress=100;
    log('ok','Vidéo prête : '+pid);
    toast('🎬 Vidéo prête : '+pid);
    await flushSave();
  }catch(e){
    if(e.name==='AbortError'||e.message==='aborted'){p.vst='wait';p.err='Annulé';}
    else{p.vst='er';p.err=e.message||'Échec';log('er','Vidéo '+pid+' : '+(e.message||e));}
  }finally{clearAbort(pid);unlock(pid);await flushSave();refresh();}
}
async function resumeVideoTasks(){
  if(!P)return;
  for(const b of P.boards){
    for(const p of b.panels){
      if(p.vst==='run'&&p.task){
        log('in','Reprise du polling pour '+p.id);
        if(lock(p.id)){
          registerAbort(p.id);
          pollVideo(p,p.task)
            .then(url=>{p.video=url;p.vst='ok';p.err='';p.vidProgress=100;return flushSave();})
            .catch(e=>{p.vst='er';p.err=e.message||'Échec';return flushSave();})
            .finally(()=>{clearAbort(p.id);unlock(p.id);refresh();});
        }
      }else if(p.vst==='run'){
        p.vst='wait';
      }
    }
  }
  refresh();
}

let ffmpegInstance=null,ffmpegLoaded=false;
async function loadFFmpeg(){
  if(ffmpegLoaded)return ffmpegInstance;
  log('in','Chargement ffmpeg.wasm (premier usage : ~30 Mo)…');
  if(typeof window.FFmpegWASM==='undefined'||typeof window.FFmpegUtil==='undefined'){
    throw new Error('Bibliothèques ffmpeg.wasm non chargées (CDN bloqué ?)');
  }
  const {FFmpeg}=window.FFmpegWASM;
  const {toBlobURL}=window.FFmpegUtil;
  const ffmpeg=new FFmpeg();
  ffmpeg.on('log',({message})=>{if(message&&message.toLowerCase().includes('error'))log('er','ffmpeg : '+String(message).slice(0,140));});
  const baseURL='https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  await ffmpeg.load({
    coreURL:await toBlobURL(`${baseURL}/ffmpeg-core.js`,'text/javascript'),
    wasmURL:await toBlobURL(`${baseURL}/ffmpeg-core.wasm`,'application/wasm')
  });
  ffmpegInstance=ffmpeg;
  ffmpegLoaded=true;
  log('ok','ffmpeg.wasm chargé');
  return ffmpeg;
}
async function blobToUint8(blob){const buf=await blob.arrayBuffer();return new Uint8Array(buf);}
async function assembleProject(){
  if(!P)return;
  const clips=[];
  const missing=[];
  for(const b of P.boards){
    for(const p of b.panels){
      if(p.video)clips.push({id:p.id,url:p.video,duration:p.duration||4});
      else missing.push(p.id);
    }
  }
  if(!clips.length)return toast('❌ Aucun clip vidéo disponible');
  if(missing.length){
    const go=confirm('⚠️ '+missing.length+' clip(s) manquant(s) :\n'+missing.slice(0,8).join(', ')+(missing.length>8?'…':'')+'\n\nAssembler quand même les '+clips.length+' clip(s) disponible(s) ?');
    if(!go)return;
    log('wr','Clips manquants ignorés : '+missing.join(', '));
  }
  if(!lock('assembly'))return toast('Assemblage déjà en cours');
  const status={progress:0,stage:'Initialisation',detail:''};
  showAssemblyStatus(status);
  const t0=Date.now();
  try{
    status.stage='Chargement du moteur';status.progress=2;showAssemblyStatus(status);
    const ffmpeg=await loadFFmpeg();
    status.stage='Téléchargement des clips';showAssemblyStatus(status);
    const files=[];
    for(let i=0;i<clips.length;i++){
      status.progress=Math.round(3+(i/clips.length)*27);
      status.detail=clips[i].id+' ('+(i+1)+'/'+clips.length+')';
      showAssemblyStatus(status);
      const blob=await fetchAsBlob(clips[i].url);
      if(!blob){log('er','Téléchargement échoué : '+clips[i].id);continue;}
      const bytes=await blobToUint8(blob);
      const name='c_'+String(i).padStart(3,'0')+'.mp4';
      files.push({name,bytes,id:clips[i].id});
    }
    if(!files.length)throw new Error('Aucun clip n\'a pu être téléchargé (CORS ou réseau)');
    if(files.length<clips.length)log('wr',(clips.length-files.length)+' clip(s) non téléchargés');
    status.stage='Écriture des fichiers';status.progress=35;showAssemblyStatus(status);
    for(const f of files)await ffmpeg.writeFile(f.name,f.bytes);
    const listTxt=files.map(f=>`file '${f.name}'`).join('\n');
    await ffmpeg.writeFile('list.txt',new TextEncoder().encode(listTxt));
    status.stage='Assemblage (rapide)';status.progress=50;showAssemblyStatus(status);
    let usedFallback=false;
    try{
      await ffmpeg.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','out.mp4']);
      const size=await getFileSize(ffmpeg,'out.mp4');
      if(size<1024)throw new Error('Fichier sortie vide');
    }catch(err){
      log('wr','Concat direct échoué → réencodage : '+err.message);
      usedFallback=true;
    }
    if(usedFallback){
      status.stage='Réencodage (compatible)';status.progress=60;showAssemblyStatus(status);
      try{await ffmpeg.deleteFile('out.mp4');}catch(e){}
      const ar=(P.ratio||'9:16');
      const [rw,rh]=ar.split(':').map(Number);
      const W=720;
      const H=Math.max(2,Math.round(720*rh/rw/2)*2);
      const vf=`scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2:color=black,fps=30,format=yuv420p`;
      await ffmpeg.exec(['-f','concat','-safe','0','-i','list.txt','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','23','-c:a','aac','-b:a','128k','-ar','44100','-movflags','+faststart','out.mp4']);
      const size=await getFileSize(ffmpeg,'out.mp4');
      if(size<1024)throw new Error('Réencodage a produit un fichier vide');
    }
    status.stage='Vérification du résultat';status.progress=85;showAssemblyStatus(status);
    const data=await ffmpeg.readFile('out.mp4');
    const bytes=data instanceof Uint8Array?data:new Uint8Array(data);
    if(!bytes||bytes.length<2048)throw new Error('MP4 résultant invalide (taille '+bytes.length+')');
    const blob=new Blob([bytes],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    const fname='xenoscope_final_'+P.id+'.mp4';
    const a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    status.stage='Terminé ('+((bytes.length/1024/1024).toFixed(1))+' Mo'+(usedFallback?' · réencodé':' · copie rapide')+')';
    status.progress=100;showAssemblyStatus(status);
    const secs=((Date.now()-t0)/1000).toFixed(1);
    log('ok','Assemblage terminé · '+files.length+' clips · '+secs+'s · '+(bytes.length/1024/1024).toFixed(2)+' Mo');
    toast('🎬 Vidéo finale prête ('+(bytes.length/1024/1024).toFixed(1)+' Mo)');
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    try{
      for(const f of files)await ffmpeg.deleteFile(f.name).catch(()=>{});
      await ffmpeg.deleteFile('list.txt').catch(()=>{});
      await ffmpeg.deleteFile('out.mp4').catch(()=>{});
    }catch(e){}
  }catch(e){
    log('er','Assemblage échoué : '+(e.message||e));
    status.stage='Échec — '+sanLog(e.message||'');status.progress=0;showAssemblyStatus(status);
    toast('❌ Assemblage : '+e.message);
    if(String(e.message).toLowerCase().includes('cors'))log('wr','Cause probable : CORS sur les URLs vidéo distantes');
    else if(String(e.message).toLowerCase().includes('memory'))log('wr','Cause probable : limite mémoire navigateur — essaie sur PC');
    else if(String(e.message).toLowerCase().includes('invalid'))log('wr','Cause probable : codecs hétérogènes — fallback réencodage déjà tenté');
  }finally{
    unlock('assembly');
    setTimeout(()=>{const el=$('#assemblyStatus');if(el)el.remove();},8000);
  }
}
async function getFileSize(ffmpeg,name){
  try{const d=await ffmpeg.readFile(name);const n=d instanceof Uint8Array?d.length:(d.byteLength||0);return n;}catch(e){return 0;}
}

async function fetchAsBlob(url){
  if(!url)return null;
  if(url.indexOf('data:')===0){try{const r=await fetch(url);return await r.blob();}catch(e){return null;}}
  try{const r=await fetch(url,{mode:'cors'});if(r.ok)return await r.blob();}catch(e){}
  try{const r=await fetch(PX(url));if(r.ok)return await r.blob();}catch(e){}
  return null;
}
async function fetchAsDataUrl(url){
  const b=await fetchAsBlob(url);
  if(!b)return null;
  return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b);});
}
function triggerDownload(dataUrl,filename){try{const a=document.createElement('a');a.href=dataUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){log('er','Téléchargement échoué : '+e.message);return false;}}
async function dlImage(img,filename){if(!img)return toast('Aucune image');const url=img.d||img.u;if(!url)return toast('Image sans données');const dataUrl=url.indexOf('data:')===0?url:await fetchAsDataUrl(url);if(!dataUrl)return toast('❌ Téléchargement impossible (CORS)');if(triggerDownload(dataUrl,filename))toast('⬇ '+filename);}
async function dlVideo(url,filename){if(!url)return toast('Aucune vidéo');const dataUrl=await fetchAsDataUrl(url);if(!dataUrl)return toast('❌ Téléchargement vidéo impossible (CORS)');if(triggerDownload(dataUrl,filename))toast('⬇ '+filename);}
async function dlZip(files,zipName){
  if(typeof JSZip==='undefined')return toast('JSZip non chargé');
  if(!files.length)return toast('Aucun fichier');
  toast('⏳ Préparation du ZIP ('+files.length+')…');
  const zip=new JSZip();let added=0,failed=0;
  for(const f of files){
    let dataUrl=f.dataUrl;
    if(!dataUrl)dataUrl=await fetchAsDataUrl(f.url);
    if(!dataUrl){failed++;continue;}
    const b64=dataUrl.split(',')[1];
    if(b64){zip.file(f.name,b64,{base64:true});added++;}else failed++;
  }
  if(!added)return toast('❌ Aucun fichier téléchargeable');
  try{
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);triggerDownload(url,zipName);
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('⬇ '+zipName+' ('+added+(failed?', '+failed+' échec(s)':'')+')');
  }catch(e){toast('Erreur ZIP : '+e.message);}
}

async function exportJSON(embed){
  if(!embed){
    const ok=confirm('⚠️ Export LÉGER\n\nLes images et vidéos distantes ne seront PAS intégrées.\nSeuls les liens (potentiellement expirants) seront conservés.\n\nContinuer ?');
    if(!ok)return;
  }
  const clean=JSON.parse(JSON.stringify(P));
  clean.task=null;
  for(const c of clean.characters||[])for(const v of c.views||[]){
    if(v.img){
      if(embed)v.img={u:v.img.u,d:v.img.d||await fetchAsDataUrl(v.img.u)||v.img.u};
      else v.img={u:v.img.u,note:'lien temporaire — peut expirer'};
    }
  }
  for(const b of clean.boards||[])for(const p of b.panels||[]){
    if(p.img){
      if(embed)p.img={u:p.img.u,d:p.img.d||await fetchAsDataUrl(p.img.u)||p.img.u};
      else p.img={u:p.img.u,note:'lien temporaire — peut expirer'};
    }
    if(p.video&&!embed)p.video={url:p.video,note:'lien temporaire'};
    p.task=null;
  }
  const json=JSON.stringify(clean,null,2);
  const size=(json.length/1024/1024).toFixed(2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  triggerDownload(url,'xenoscope_'+(embed?'complet_':'meta_')+P.id+'.json');
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('JSON '+(embed?'complet':'léger')+' exporté ('+size+' Mo)');
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data||typeof data!=='object')throw new Error('Contenu invalide');
      if(!data.characters&&!data.boards)throw new Error('Structure invalide (ni characters ni boards)');
      const normalized=normalizeProject(data);
      let nImg=0,nVid=0;
      for(const c of normalized.characters)for(const v of c.views)if(v.img)nImg++;
      for(const b of normalized.boards)for(const p of b.panels){if(p.img)nImg++;if(p.video)nVid++;}
      setP(normalized);
      page=KEYS.list.length?1:0;render();resumeVideoTasks();
      toast('✓ Projet importé · '+nImg+' img · '+nVid+' vidéo(s)');
    }catch(e){toast('❌ Import : '+e.message);}
  };
  fr.onerror=()=>toast('❌ Lecture impossible');
  fr.readAsText(file);
}

  if(a==='retry-char'){genCharView(b.dataset.cid,b.dataset.vid);return;}
  if(a==='dlcharview'){const c=findChar(b.dataset.cid);const v=c&&c.views.find(x=>x.id===b.dataset.vid);if(v&&v.img)dlImage(v.img,charFilename(b.dataset.cid,b.dataset.vid));return;}
  if(a==='dlcharbundle'){dlZip(await charFiles(b.dataset.cid),'personnage_'+safeName(b.dataset.cid)+'.zip');return;}
  if(a==='panel-dur'){const f=findPanel(id);if(f){f.panel.duration=+b.dataset.d;save();refresh();}return;}
  if(a==='panel-chars'){const f=findPanel(id);if(!f)return;const inner=$('#modalInner');inner.innerHTML='<h3>Personnages — '+esc(id)+'</h3>'+P.characters.map(c=>{const checked=f.panel.chars.indexOf(c.id)>=0?'checked':'';return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0"><input type="checkbox" data-charpick="'+c.id+'" '+checked+'><span>'+esc(c.name)+'</span></label>';}).join('')+'<div class="info">Limite : <b>'+MAX_REF+'</b> références envoyées max.</div><div class="rw" style="justify-content:flex-end;margin-top:10px">'+btn('modal-cancel','Fermer','ghost')+'</div>';$('#modal').classList.add('on');inner.querySelector('[data-a="modal-cancel"]').onclick=()=>{const checked=Array.from(inner.querySelectorAll('[data-charpick]')).filter(x=>x.checked).map(x=>x.dataset.charpick);f.panel.chars=checked;save();$('#modal').classList.remove('on');refresh();};return;}
  if(a==='panel-img'){if(!KEYS.list.length)return toast('Enregistre d\'abord ta clé API');const f=findPanel(id);if(!f)return;const refsCount=Math.min((f.panel.chars||[]).length*2,MAX_REF);confirmModal('Générer l\'image de '+id,[['Modèle',IMG],['Format',P.ratio],['Références',refsCount+'/'+MAX_REF],['Coût','INCONNU']],()=>genPanelImg(id),'Générer');return;}
  if(a==='retry-panel'){genPanelImg(id);return;}
  if(a==='panel-dl'){const f=findPanel(id);if(!f||!f.panel.img)return;dlImage(f.panel.img,panelFilename(id));return;}
  if(a==='panel-vid'){if(!KEYS.list.length)return toast('Enregistre d\'abord ta clé API');const f=findPanel(id);if(!f)return;if(!f.panel.img)return toast('Génère d\'abord l\'image');const secs=String(Math.max(4,Math.min(f.panel.duration||4,12)));confirmModal('Lancer la vidéo de '+id,[['Modèle',VID],['Durée',secs+' s'],['Résolution','720P'],['Format',P.ratio],['Mode','reference'],['Coût','INCONNU'],['Délai estimé','1 à 5 minutes']],()=>launchVideo(id),'Générer la vidéo');return;}
  if(a==='retry-vid'){launchVideo(id);return;}
  if(a==='panel-dlvid'){const f=findPanel(id);if(!f||!f.panel.video)return;dlVideo(f.panel.video,videoFilename(id));return;}
  if(a==='panel-add'){const board=P.boards.find(x=>x.id===b.dataset.bid);if(!board)return;const n=board.panels.length+1;const newId=board.id+'_P'+String(n).padStart(2,'0');board.panels.push(newPanel({id:newId,desc:'Nouvelle case'}));save();refresh();return;}
  if(a==='panel-del'){const f=findPanel(id);if(!f)return;if(!confirm('Supprimer la case '+id+' ?'))return;f.board.panels=f.board.panels.filter(x=>x.id!==id);save();refresh();return;}
  if(a==='board-add'){const n=P.boards.length+1;const newId='S'+String(n).padStart(2,'0');P.boards.push({id:newId,title:'Nouvelle scène',panels:[newPanel({id:newId+'_P01',desc:'Nouvelle case'})]});save();refresh();return;}
  if(a==='board-del'){if(!confirm('Supprimer la planche '+b.dataset.bid+' ?'))return;P.boards=P.boards.filter(x=>x.id!==b.dataset.bid);save();refresh();return;}
  if(a==='board-zip'){dlZip(await boardFiles(b.dataset.bid),'storyboard_'+safeName(b.dataset.bid)+'.zip');return;}
  if(a==='assemble'){assembleProject();return;}
  if(a==='export-full'){await exportJSON(true);return;}
  if(a==='export-meta'){await exportJSON(false);return;}
  if(a==='export-all-zip'){dlZip(await allFiles(),'xenoscope_'+P.id+'.zip');return;}
  if(a==='sess'){sessions();return;}
  if(a==='new'){await flushSave();setP(newP());page=KEYS.list.length?1:0;const m=$('#md');if(m)m.remove();render();return;}
}
document.addEventListener('click',e=>{onClick(e).catch(er=>{log('er','action : '+(er.message||er));});});
document.addEventListener('input',e=>{
  const t=e.target;if(!P)return;
  if(t.dataset.chardesc){const c=findChar(t.dataset.chardesc);if(c){c.desc=t.value;save();}return;}
  if(t.dataset.charbible){const c=findChar(t.dataset.charbible);if(c){c.bible=t.value;save();}return;}
  if(t.dataset.charPrompt){const parts=t.dataset.charPrompt.split('/');const v=findView(parts[0],parts[1]);if(v){v.prompt=t.value;save();}return;}
  if(t.dataset.paneldesc){const f=findPanel(t.dataset.paneldesc);if(f){f.panel.desc=t.value;save();}return;}
  if(t.dataset.panelimgprompt){const f=findPanel(t.dataset.panelimgprompt);if(f){f.panel.imgPrompt=t.value;save();}return;}
  if(t.dataset.panelanimprompt){const f=findPanel(t.dataset.panelanimprompt);if(f){f.panel.animPrompt=t.value;save();}return;}
  if(t.dataset.boardtitle){const b=P.boards.find(x=>x.id===t.dataset.boardtitle);if(b){b.title=t.value;save();}return;}
});
document.addEventListener('change',async e=>{
  const t=e.target;if(!P)return;
  if(t.id==='importFile'){const f=t.files[0];if(f)importJSON(f);return;}
  if(t.dataset.upview){const parts=t.dataset.upview.split('/');const v=findView(parts[0],parts[1]);if(!v)return;const f=t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=async()=>{const s=Math.min(1,1024/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const d=cv.toDataURL('image/jpeg',0.88);v.img={u:d,d:d};v.err='';await flushSave();refresh();};im.src=fr.result;};fr.readAsDataURL(f);return;}
  if(t.dataset.uppanel){const f=findPanel(t.dataset.uppanel);if(!f)return;const file=t.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=async()=>{const s=Math.min(1,1024/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const d=cv.toDataURL('image/jpeg',0.88);f.panel.img={u:d,d:d};f.panel.err='';await flushSave();refresh();};im.src=fr.result;};fr.readAsDataURL(file);return;}
});
async function sessions(){
  let md=$('#md');if(!md){document.body.insertAdjacentHTML('beforeend','<div id="md" class="modal on"><div class="modal-inner" id="mdc"></div></div>');md=$('#md');}
  const l=(await dbAll('projects')).sort((a,b)=>b.upd-a.upd);
  $('#mdc').innerHTML='<h3>Mes projets</h3><div class="rw">'+btn('new','+ Nouveau projet','')+btn('closemd','Fermer','sm ghost')+'</div>'+l.map(p=>{const panels=[];for(const b of (p.boards||[]))for(const x of (b.panels||[]))panels.push(x);const imgs=panels.filter(x=>x.img).length;const vids=panels.filter(x=>x.video).length;return '<div class="cd" style="margin-top:8px"><b>'+esc(p.title||'Projet')+'</b><div class="lab">'+new Date(p.upd).toLocaleString('fr-FR')+' · '+(p.boards||[]).length+' planches · '+panels.length+' cases · '+imgs+' img · '+vids+' vid</div><div class="rw">'+btn('open','Ouvrir','sm','data-id="'+p.id+'"')+btn('delsess','Supprimer','sm ghost','data-id="'+p.id+'"')+'</div></div>';}).join('');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='closemd'){const m=$('#md');if(m)m.remove();return;}
  if(a==='open'){await flushSave();const p=await dbGet('projects',id);if(!p)return;setP(p);page=KEYS.list.length?1:0;const m=$('#md');if(m)m.remove();render();resumeVideoTasks();return;}
  if(a==='delsess'){if(!confirm('Supprimer ce projet ?'))return;await dbDel('projects',id);const m=$('#md');if(m)m.remove();sessions();return;}
});
(async()=>{
  try{db=await Promise.race([openDB(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('délai')),3000))]);}catch(e){db=null;fall();}
  try{
    const k=await dbGet('config','keys');
    if(k){KEYS.plan=k.plan||'free';KEYS.list=(k.list||[]).map(mkKey);if(k.proxy)PROXY=k.proxy;}
    const last=await dbGet('config','last');
    const p=last?await dbGet('projects',last.v):null;
    setP(p||newP());
  }catch(e){setP(newP());}
  page=KEYS.list.length?Math.max(1,Math.min(P.page||1,3)):0;
  render();
  const nbPanels=P.boards.reduce((s,b)=>s+b.panels.length,0);
  log('in','Xenoscope Studio prêt · '+P.boards.length+' planches · '+nbPanels+' cases');
  await resumeVideoTasks();
})();
</script></body></html>
