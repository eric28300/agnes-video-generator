<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Video IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0a0e1a;color:#e8edf5;padding:12px;min-height:100vh;
  font-size:14px;line-height:1.4;
}
.app{max-width:560px;margin:0 auto}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:22px;color:#8b9cff;font-weight:bold;margin-bottom:4px}
.header p{color:#8892a8;font-size:12px}
.badge{
  display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;
  background:#0e3b1e;color:#4ade80;font-size:10px;font-weight:bold;
  border:1px solid #166534;
}
.card{
  background:#141a2e;border:1px solid #232c45;border-radius:12px;
  padding:14px;margin-bottom:10px;
}
.card h2{
  font-size:11px;color:#8892a8;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px;font-weight:bold;
}
label{display:block;font-size:12px;color:#c5cfe0;margin-bottom:5px;font-weight:bold}
input,textarea,select{
  width:100%;padding:10px;background:#0a0e1a;border:1px solid #232c45;
  border-radius:8px;color:#e8edf5;font-size:14px;font-family:inherit;
}
input:focus,textarea:focus,select:focus{border-color:#6366f1;outline:none}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.hint{font-size:11px;color:#5a6680;margin-top:4px;line-height:1.3}
.hint a{color:#8b9cff;text-decoration:none}
button{
  width:100%;padding:13px;border:none;border-radius:10px;
  font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;
  margin-top:5px;
}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:active{background:#4f46e5}
.btn-primary:disabled{background:#3a3f5a;color:#8892a8}
.btn-ghost{background:transparent;color:#8892a8;border:1px solid #232c45;font-size:12px;padding:9px}
.spinner{
  display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.status{
  text-align:center;font-size:12px;color:#8892a8;margin-top:10px;
  min-height:16px;
}
.status.ok{color:#4ade80}
.status.err{color:#f87171}
.player{
  margin-top:12px;background:#000;border-radius:10px;overflow:hidden;
  display:none;border:1px solid #232c45;
}
.player video{width:100%;display:block}
.log{
  background:#05080f;border:1px solid #232c45;border-radius:10px;
  padding:10px;max-height:200px;overflow-y:auto;font-size:11px;
  margin-top:10px;
}
.log:empty{display:none}
.log-entry{
  padding:4px 0;border-bottom:1px solid #141a2e;
  display:flex;gap:6px;align-items:flex-start;
}
.log-entry:last-child{border-bottom:none}
.log-time{color:#4a5568;font-family:monospace;font-size:10px;min-width:50px}
.log-tag{
  font-size:9px;font-weight:bold;padding:1px 5px;border-radius:3px;
  text-transform:uppercase;min-width:46px;text-align:center;
  flex-shrink:0;
}
.tag-info{background:#1e3a5f;color:#7ab7ff}
.tag-pending{background:#3b2e0e;color:#fbbf24}
.tag-process{background:#0e2a4a;color:#60a5fa}
.tag-ok{background:#0e3b1e;color:#4ade80}
.tag-err{background:#4a0e0e;color:#f87171}
.log-msg{color:#c5cfe0;flex:1;word-break:break-word}
.footer{
  text-align:center;color:#4a5568;font-size:10px;
  margin-top:16px;line-height:1.5;
}
.row{display:flex;gap:8px}
.row > div{flex:1}
.notice{
  background:#1e2a45;border-left:3px solid #6366f1;padding:10px;
  border-radius:6px;font-size:11px;color:#a8b8d0;margin-bottom:12px;
  line-height:1.5;
}
.provider-info{
  font-size:11px;color:#5a6680;margin-top:6px;line-height:1.3;
}
.duration-info{
  font-size:10px;color:#4ade80;margin-top:4px;
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Studio Video IA</h1>
    <p>Generateur video IA multi-fournisseurs</p>
    <span class="badge">PRET A L'EMPLOI</span>
  </div>

  <div class="notice">
    <b>5 modes disponibles :</b> Agnes AI · fal.ai · Makefun · LTX-Video · Runway.
  </div>

  <!-- ===== FOURNISSEUR ===== -->
  <div class="card">
    <h2>Fournisseur</h2>
    <div class="field">
      <label for="provider">Choisissez un mode</label>
      <select id="provider">
        <option value="agnes" selected>Agnes AI · cle sk- · gratuit illimite</option>
        <option value="fal">fal.ai · cle fal_ · 5/jour ultra-rapide</option>
        <option value="makefun">Makefun · cle mf_ · gratuit jusqu'a 30 s</option>
        <option value="ltx">LTX-Video · cle ltx_ · gratuit jusqu'a 60 s</option>
        <option value="runway">Runway · cle rw_ · 5/jour</option>
      </select>
      <div class="provider-info" id="providerInfo">
        Agnes AI : gratuit et illimite, file d'attente parfois longue.
      </div>
    </div>

    <div class="field" id="keyField">
      <label for="apiKey">Cle API</label>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <div class="hint" id="keyHint"></div>
    </div>
  </div>

  <!-- ===== PARAMETRES ===== -->
  <div class="card">
    <h2>Parametres</h2>
    <div class="field">
      <label for="model">Modele</label>
      <select id="model">
        <option value="agnes-video-2.5-flash">Agnes 2.5 Flash (gratuit)</option>
      </select>
    </div>
    <div class="row">
      <div class="field">
        <label for="duration">Duree</label>
        <select id="duration">
          <option value="5" selected>5 s</option>
          <option value="8">8 s</option>
          <option value="10">10 s</option>
        </select>
        <div class="duration-info" id="durationInfo"></div>
      </div>
      <div class="field">
        <label for="aspect">Format</label>
        <select id="aspect">
          <option value="16:9" selected>16:9</option>
          <option value="9:16">9:16</option>
          <option value="1:1">1:1</option>
        </select>
      </div>
    </div>
    <div class="field" id="regionField">
      <label for="region">Region Agnes</label>
      <select id="region">
        <option value="cn" selected>Chine (.cn)</option>
        <option value="com">International (.com)</option>
      </select>
    </div>
  </div>

  <!-- ===== PROMPT ===== -->
  <div class="card">
    <h2>Description</h2>
    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Ex: Un chat astronaute flottant dans l'ISS, camera lente, eclairage realiste."></textarea>
    </div>
  </div>

  <!-- ===== ACTIONS ===== -->
  <div class="card">
    <button class="btn-primary" id="genBtn">Generer la video</button>
    <button class="btn-ghost" id="clearBtn">Vider le journal</button>
    <div class="status" id="status"></div>
    <div class="player" id="player"></div>
    <div class="log" id="log"></div>
  </div>

  <div class="footer">
    Agnes AI · fal.ai · Makefun · LTX-Video · Runway
  </div>

</div>

<script>
(function(){
  var providerEl = document.getElementById('provider');
  var providerInfo = document.getElementById('providerInfo');
  var keyField = document.getElementById('keyField');
  var keyHint = document.getElementById('keyHint');
  var apiKeyEl = document.getElementById('apiKey');
  var modelEl = document.getElementById('model');
  var durationEl = document.getElementById('duration');
  var durationInfo = document.getElementById('durationInfo');
  var aspectEl = document.getElementById('aspect');
  var regionField = document.getElementById('regionField');
  var regionEl = document.getElementById('region');
  var promptEl = document.getElementById('prompt');
  var genBtn = document.getElementById('genBtn');
  var clearBtn = document.getElementById('clearBtn');
  var statusEl = document.getElementById('status');
  var player = document.getElementById('player');
  var logEl = document.getElementById('log');

  var abortCtrl = null;

  /* =========================================================
     CONFIGURATION DES DUREES PAR FOURNISSEUR
     ========================================================= */
  var DURATIONS = {
    agnes: {
      values: [5, 8, 10],
      default: 5,
      info: 'Agnes Flash : jusqu\'a 10 s en 720P.'
    },
    fal: {
      values: [5, 8, 10],
      default: 5,
      info: 'MiniMax H3 : jusqu\'a 10 s, 5 gratuites/jour.'
    },
    makefun: {
      values: [5, 10, 15, 20, 25, 30],
      default: 10,
      info: 'Makefun : jusqu\'a 30 s en plan unique.'
    },
    ltx: {
      values: [5, 10, 15, 20, 30, 45, 60],
      default: 10,
      info: 'LTX-Video : jusqu\'a 60 s (qualite optimale 10-20 s).'
    },
    runway: {
      values: [5, 10],
      default: 5,
      info: 'Runway Gen-3 : 5 ou 10 s, 5 gratuites/jour.'
    }
  };

  /* =========================================================
     HELPERS
     ========================================================= */
  function setStatus(t, c){
    statusEl.textContent = t;
    statusEl.className = 'status' + (c ? ' ' + c : '');
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function log(level, msg){
    var tags = {info:'INFO', pending:'ATTENTE', process:'EN COURS', ok:'SUCCES', err:'ERREUR'};
    var now = new Date().toTimeString().slice(0,8);
    var el = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML = '<span class="log-time">' + now + '</span>'
      + '<span class="log-tag tag-' + level + '">' + (tags[level] || level) + '</span>'
      + '<span class="log-msg">' + esc(msg) + '</span>';
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function serializeError(err){
    if (!err) return 'Erreur inconnue';
    if (typeof err === 'string') return err;
    if (err.message) return err.message;
    try {
      var keys = Object.keys(err);
      if (keys.length === 0) return String(err);
      var parts = [];
      keys.forEach(function(k){
        var v = err[k];
        if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') {
          parts.push(k + ': ' + v);
        } else if (v && typeof v === 'object') {
          parts.push(k + ': ' + JSON.stringify(v));
        }
      });
      return parts.join(' | ') || String(err);
    } catch(e){
      return String(err);
    }
  }

  function showVideo(src){
    player.innerHTML = '';
    var v = document.createElement('video');
    v.controls = true;
    v.src = src;
    v.style.width = '100%';
    v.style.display = 'block';
    player.appendChild(v);
    player.style.display = 'block';
    v.addEventListener('loadeddata', function(){
      v.play().catch(function(){});
    });
  }

  /* =========================================================
     MISE A JOUR DYNAMIQUE DES DUREES
     ========================================================= */
  function refreshDurations(providerKey){
    var cfg = DURATIONS[providerKey] || DURATIONS.agnes;
    durationEl.innerHTML = '';
    cfg.values.forEach(function(v){
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v + ' s';
      if (v === cfg.default) opt.selected = true;
      durationEl.appendChild(opt);
    });
    durationInfo.textContent = cfg.info;
  }

  /* =========================================================
     MISE A JOUR DYNAMIQUE DE L'INTERFACE
     ========================================================= */
  function refreshProviderUI(){
    var p = providerEl.value;

    if (p === 'agnes') {
      keyField.style.display = '';
      regionField.style.display = '';
      apiKeyEl.placeholder = 'sk-...';
      keyHint.innerHTML = 'Obtenir une cle : <a href="https://platform.agnes-ai.cn" target="_blank">platform.agnes-ai.cn</a>';
      providerInfo.textContent = 'Agnes AI : gratuit et illimite, file d\'attente parfois longue.';
      modelEl.innerHTML =
        '<option value="agnes-video-2.5-flash">Agnes 2.5 Flash (gratuit)</option>';

    } else if (p === 'fal') {
      keyField.style.display = '';
      regionField.style.display = 'none';
      apiKeyEl.placeholder = 'fal_...';
      keyHint.innerHTML = 'Obtenir une cle : <a href="https://fal.ai/dashboard/keys" target="_blank">fal.ai/dashboard/keys</a>';
      providerInfo.textContent = 'fal.ai : 5 videos gratuites par jour, generation ultra-rapide.';
      modelEl.innerHTML =
        '<option value="fal-ai/minimax/h3/text-to-video">MiniMax H3 (5/jour gratuit)</option>';

    } else if (p === 'makefun') {
      keyField.style.display = '';
      regionField.style.display = 'none';
      apiKeyEl.placeholder = 'mf_...';
      keyHint.innerHTML = 'Obtenir une cle : <a href="https://makefun.ai/app/dev" target="_blank">makefun.ai/app/dev</a>';
      providerInfo.textContent = 'Makefun : gratuit, integre Wan 2.6 / Veo 3.1, jusqu\'a 30 s.';
      modelEl.innerHTML =
        '<option value="wan-2.6">Wan 2.6 (gratuit)</option>' +
        '<option value="veo-3.1-fast">Veo 3.1 Fast</option>' +
        '<option value="kling-3.0">Kling 3.0</option>';

    } else if (p === 'ltx') {
      keyField.style.display = '';
      regionField.style.display = 'none';
      apiKeyEl.placeholder = 'ltx_...';
      keyHint.innerHTML = 'Obtenir une cle : <a href="https://console.ltx.video/" target="_blank">console.ltx.video</a>';
      providerInfo.textContent = 'LTX-Video : gratuit, jusqu\'a 60 s, qualite optimale 10-20 s.';
      modelEl.innerHTML =
        '<option value="ltx-video-13b">LTX-Video 13B (gratuit)</option>' +
        '<option value="ltx-video-13b-distilled">LTX-Video 13B Distilled (rapide)</option>';

    } else if (p === 'runway') {
      keyField.style.display = '';
      regionField.style.display = 'none';
      apiKeyEl.placeholder = 'rw_...';
      keyHint.innerHTML = 'Obtenir une cle : <a href="https://dev.runwayml.com/" target="_blank">dev.runwayml.com</a>';
      providerInfo.textContent = 'Runway Gen-3 Alpha : 5 videos gratuites par jour, 5 ou 10 s.';
      modelEl.innerHTML =
        '<option value="gen3a_turbo">Gen-3 Alpha Turbo (rapide)</option>' +
        '<option value="gen3a">Gen-3 Alpha</option>';
    }

    /* Mise a jour des durees disponibles */
    refreshDurations(p);
  }
  providerEl.addEventListener('change', refreshProviderUI);

  /* =========================================================
     AGNES AI
     ========================================================= */
  function generateAgnes(apiKey, model, prompt, duration, aspect, region, signal){
    var baseUrl = region === 'com'
      ? 'https://apihub.agnes-ai.com/v1'
      : 'https://apihub.agnes-ai.cn/v1';
    var pollHost = region === 'com'
      ? 'https://apihub.agnes-ai.com'
      : 'https://apihub.agnes-ai.cn';

    log('pending', 'Creation de la tache Agnes...');

    return fetch(baseUrl + '/videos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: model,
        prompt: prompt,
        seconds: String(duration),
        mode: 'text',
        size: '720P',
        aspect_ratio: aspect
      }),
      signal: signal
    }).then(function(res){
      if (!res.ok) {
        return res.text().then(function(t){
          throw new Error('HTTP ' + res.status + ' - ' + t.slice(0, 200));
        });
      }
      return res.json();
    }).then(function(created){
      var videoId = created.video_id || created.id;
      if (!videoId) throw new Error('Pas de video_id dans la reponse Agnes.');
      log('info', 'Tache creee : ' + videoId);
      var pollUrl = pollHost + '/agnesapi?video_id=' + encodeURIComponent(videoId)
                  + '&model_name=' + encodeURIComponent(model);
      var start = Date.now();
      var attempt = 0;
      var maxAttempts = 120;
      return new Promise(function(resolve, reject){
        function poll(){
          if (signal && signal.aborted) { reject(new Error('Annule')); return; }
          if (Date.now() - start > 20 * 60 * 1000) { reject(new Error('Timeout 20 min')); return; }
          attempt++;
          if (attempt > maxAttempts) { reject(new Error('Trop de tentatives.')); return; }
          fetch(pollUrl, { headers: { 'Authorization': 'Bearer ' + apiKey }, signal: signal })
            .then(function(r){
              if (!r.ok) return r.text().then(function(t){
                throw new Error('Polling HTTP ' + r.status + ' - ' + t.slice(0, 150));
              });
              return r.json();
            })
            .then(function(data){
              var st = (data.status || '').toLowerCase();
              var elapsed = Math.round((Date.now() - start) / 1000);
              log('process', 'Statut : ' + st + ' (' + elapsed + 's)');
              if (st === 'completed' || data.url) { resolve(data.url || data.video_url); return; }
              if (st === 'failed' || st === 'error') {
                reject(new Error(data.error || data.message || 'Echec Agnes'));
                return;
              }
              var delay = attempt < 8 ? 8000 : 15000;
              setTimeout(poll, delay);
            })
            .catch(reject);
        }
        setTimeout(poll, 5000);
      });
    });
  }

  /* =========================================================
     FAL.AI
     ========================================================= */
  function generateFal(apiKey, model, prompt, duration, aspect, signal){
    log('pending', 'Soumission a fal.ai...');
    return fetch('https://queue.fal.run/' + model, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Key ' + apiKey },
      body: JSON.stringify({
        prompt: prompt,
        duration: String(duration),
        aspect_ratio: aspect
      }),
      signal: signal
    }).then(function(res){
      if (!res.ok) {
        return res.text().then(function(t){ throw new Error('HTTP ' + res.status + ' - ' + t.slice(0, 200)); });
      }
      return res.json();
    }).then(function(submit){
      var statusUrl = submit.status_url;
      var responseUrl = submit.response_url;
      if (!statusUrl || !responseUrl) throw new Error('Reponse fal.ai incomplete.');
      log('info', 'Requete fal.ai : ' + (submit.request_id || ''));
      var start = Date.now();
      return new Promise(function(resolve, reject){
        function poll(){
          if (signal && signal.aborted) { reject(new Error('Annule')); return; }
          if (Date.now() - start > 5 * 60 * 1000) { reject(new Error('Timeout 5 min')); return; }
          fetch(statusUrl, { headers: { 'Authorization': 'Key ' + apiKey }, signal: signal })
            .then(function(r){
              if (!r.ok) return r.text().then(function(t){
                throw new Error('Polling HTTP ' + r.status + ' - ' + t.slice(0, 150));
              });
              return r.json();
            })
            .then(function(data){
              var st = (data.status || '').toUpperCase();
              var elapsed = Math.round((Date.now() - start) / 1000);
              log('process', 'Statut : ' + st + ' (' + elapsed + 's)');
              if (st === 'COMPLETED') {
                fetch(responseUrl, { headers: { 'Authorization': 'Key ' + apiKey }, signal: signal })
                  .then(function(r){ return r.json(); })
                  .then(function(result){
                    var url = (result.video && result.video.url) || result.video_url || result.url;
                    if (!url) { reject(new Error('Aucune URL video dans la reponse fal.ai.')); return; }
                    resolve(url);
                  })
                  .catch(reject);
                return;
              }
              if (st === 'FAILED' || st === 'ERROR') {
                reject(new Error(data.error || 'Echec fal.ai'));
                return;
              }
              setTimeout(poll, 3000);
            })
            .catch(reject);
        }
        setTimeout(poll, 3000);
      });
    });
  }

  /* =========================================================
     MAKEFUN
     ========================================================= */
  function generateMakefun(apiKey, model, prompt, duration, aspect, signal){
    log('pending', 'Soumission a Makefun (' + duration + 's)...');
    return fetch('https://api.makefun.ai/v1/videos/generations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        prompt: prompt,
        duration: parseInt(duration, 10),
        aspect_ratio: aspect
      }),
      signal: signal
    }).then(function(res){
      if (!res.ok) {
        return res.text().then(function(t){ throw new Error('HTTP ' + res.status + ' - ' + t.slice(0, 200)); });
      }
      return res.json();
    }).then(function(submit){
      var jobId = submit.id || submit.job_id || submit.task_id;
      if (!jobId) throw new Error('Pas de job_id dans la reponse Makefun.');
      log('info', 'Job Makefun : ' + jobId);
      var start = Date.now();
      var attempt = 0;
      return new Promise(function(resolve, reject){
        function poll(){
          if (signal && signal.aborted) { reject(new Error('Annule')); return; }
          if (Date.now() - start > 15 * 60 * 1000) { reject(new Error('Timeout 15 min')); return; }
          attempt++;
          fetch('https://api.makefun.ai/v1/videos/generations/' + jobId, {
            headers: { 'Authorization': 'Bearer ' + apiKey },
            signal: signal
          })
            .then(function(r){
              if (!r.ok) return r.text().then(function(t){
                throw new Error('Polling HTTP ' + r.status + ' - ' + t.slice(0, 150));
              });
              return r.json();
            })
            .then(function(data){
              var st = (data.status || '').toLowerCase();
              var elapsed = Math.round((Date.now() - start) / 1000);
              log('process', 'Statut : ' + st + ' (' + elapsed + 's)');
              if (st === 'succeeded' || st === 'completed' || st === 'success') {
                var url = data.video_url || data.url || (data.output && data.output.url);
                if (!url) { reject(new Error('Aucune URL video dans la reponse Makefun.')); return; }
                resolve(url);
                return;
              }
              if (st === 'failed' || st === 'error') {
                reject(new Error(data.error || 'Echec Makefun'));
                return;
              }
              setTimeout(poll, 5000);
            })
            .catch(reject);
        }
        setTimeout(poll, 5000);
      });
    });
  }

  /* =========================================================
     LTX-VIDEO
     ========================================================= */
  function generateLtx(apiKey, model, prompt, duration, aspect, signal){
    log('pending', 'Soumission a LTX-Video (' + duration + 's)...');
    return fetch('https://api.deapi.ai/api/v2/videos/generations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        prompt: prompt,
        duration: parseInt(duration, 10),
        aspect_ratio: aspect
      }),
      signal: signal
    }).then(function(res){
      if (!res.ok) {
        return res.text().then(function(t){ throw new Error('HTTP ' + res.status + ' - ' + t.slice(0, 200)); });
      }
      return res.json();
    }).then(function(submit){
      var taskId = submit.id || submit.task_id;
      if (!taskId) throw new Error('Pas de task_id dans la reponse LTX.');
      log('info', 'Task LTX : ' + taskId);
      var start = Date.now();
      return new Promise(function(resolve, reject){
        function poll(){
          if (signal && signal.aborted) { reject(new Error('Annule')); return; }
          if (Date.now() - start > 15 * 60 * 1000) { reject(new Error('Timeout 15 min')); return; }
          fetch('https://api.deapi.ai/api/v2/videos/generations/' + taskId, {
            headers: { 'Authorization': 'Bearer ' + apiKey },
            signal: signal
          })
            .then(function(r){
              if (!r.ok) return r.text().then(function(t){
                throw new Error('Polling HTTP ' + r.status + ' - ' + t.slice(0, 150));
              });
              return r.json();
            })
            .then(function(data){
              var st = (data.status || '').toLowerCase();
              var elapsed = Math.round((Date.now() - start) / 1000);
              log('process', 'Statut : ' + st + ' (' + elapsed + 's)');
              if (st === 'succeeded' || st === 'completed' || st === 'success') {
                var url = data.video_url || data.url || (data.output && data.output.url);
                if (!url) { reject(new Error('Aucune URL video dans la reponse LTX.')); return; }
                resolve(url);
                return;
              }
              if (st === 'failed' || st === 'error') {
                reject(new Error(data.error || 'Echec LTX'));
                return;
              }
              setTimeout(poll, 3000);
            })
            .catch(reject);
        }
        setTimeout(poll, 3000);
      });
    });
  }

  /* =========================================================
     RUNWAY
     ========================================================= */
  function generateRunway(apiKey, model, prompt, duration, aspect, signal){
    log('pending', 'Soumission a Runway (' + model + ')...');
    /* Runway utilise un endpoint et un polling specifiques */
    return fetch('https://api.dev.runwayml.com/v1/image_to_video', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
        'X-Runway-Version': '2024-11-06'
      },
      body: JSON.stringify({
        model: model,
        promptText: prompt,
        duration: parseInt(duration, 10),
        ratio: aspect === '9:16' ? '720:1280' : aspect === '1:1' ? '960:960' : '1280:720'
      }),
      signal: signal
    }).then(function(res){
      if (!res.ok) {
        return res.text().then(function(t){ throw new Error('HTTP ' + res.status + ' - ' + t.slice(0, 200)); });
      }
      return res.json();
    }).then(function(submit){
      var taskId = submit.id;
      if (!taskId) throw new Error('Pas de task_id dans la reponse Runway.');
      log('info', 'Task Runway : ' + taskId);
      var start = Date.now();
      return new Promise(function(resolve, reject){
        function poll(){
          if (signal && signal.aborted) { reject(new Error('Annule')); return; }
          if (Date.now() - start > 5 * 60 * 1000) { reject(new Error('Timeout 5 min')); return; }
          fetch('https://api.dev.runwayml.com/v1/tasks/' + taskId, {
            headers: {
              'Authorization': 'Bearer ' + apiKey,
              'X-Runway-Version': '2024-11-06'
            },
            signal: signal
          })
            .then(function(r){
              if (!r.ok) return r.text().then(function(t){
                throw new Error('Polling HTTP ' + r.status + ' - ' + t.slice(0, 150));
              });
              return r.json();
            })
            .then(function(data){
              var st = (data.status || '').toUpperCase();
              var elapsed = Math.round((Date.now() - start) / 1000);
              log('process', 'Statut : ' + st + ' (' + elapsed + 's)');
              if (st === 'SUCCEEDED') {
                var url = (data.output && data.output[0]) || data.url;
                if (!url) { reject(new Error('Aucune URL video dans la reponse Runway.')); return; }
                resolve(url);
                return;
              }
              if (st === 'FAILED') {
                reject(new Error(data.failure || 'Echec Runway'));
                return;
              }
              setTimeout(poll, 4000);
            })
            .catch(reject);
        }
        setTimeout(poll, 4000);
      });
    });
  }

  /* =========================================================
     GENERATION PRINCIPALE
     ========================================================= */
  genBtn.addEventListener('click', function(){
    var provider = providerEl.value;
    var prompt = promptEl.value.trim();
    var model = modelEl.value;
    var duration = durationEl.value;
    var aspect = aspectEl.value;
    var apiKey = apiKeyEl.value.trim();
    var region = regionEl.value;

    /* Validation prompt */
    if (!prompt || prompt.length < 5) {
      log('err', 'Prompt trop court (min 5 caracteres).');
      setStatus('Prompt trop court', 'err');
      return;
    }

    /* Validation cle API */
    var prefixMap = { agnes: 'sk-', fal: 'fal_', makefun: 'mf_', ltx: 'ltx_', runway: 'rw_' };
    var prefix = prefixMap[provider];
    if (!apiKey) {
      log('err', 'Cle API requise pour ' + provider + '.');
      setStatus('Cle requise', 'err');
      return;
    }
    if (prefix && apiKey.indexOf(prefix) !== 0) {
      log('err', 'La cle ' + provider + ' doit commencer par "' + prefix + '".');
      setStatus('Cle invalide', 'err');
      return;
    }

    /* Verrouillage UI */
    genBtn.disabled = true;
    genBtn.innerHTML = '<span class="spinner"></span>Generation...';
    player.style.display = 'none';
    player.innerHTML = '';
    setStatus('En cours...', '');

    log('info', 'Fournisseur : ' + provider);
    log('info', 'Modele : ' + model + ' · ' + duration + 's · ' + aspect);
    log('info', 'Prompt : ' + prompt.slice(0, 80));

    var t0 = Date.now();
    abortCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var signal = abortCtrl ? abortCtrl.signal : undefined;

    var task;
    if (provider === 'agnes') {
      task = generateAgnes(apiKey, model, prompt, duration, aspect, region, signal);
    } else if (provider === 'fal') {
      task = generateFal(apiKey, model, prompt, duration, aspect, signal);
    } else if (provider === 'makefun') {
      task = generateMakefun(apiKey, model, prompt, duration, aspect, signal);
    } else if (provider === 'ltx') {
      task = generateLtx(apiKey, model, prompt, duration, aspect, signal);
    } else {
      task = generateRunway(apiKey, model, prompt, duration, aspect, signal);
    }

    task.then(function(url){
      var elapsed = Math.round((Date.now() - t0) / 1000);
      setStatus('Video generee en ' + elapsed + 's', 'ok');
      log('ok', 'Video prete en ' + elapsed + 's');
      showVideo(url);
    }).catch(function(err){
      var msg = serializeError(err);
      log('err', 'Echec : ' + msg);
      setStatus('Erreur', 'err');
      if (/video_queue_full/i.test(msg)) {
        log('info', 'File Agnes pleine. Essayez fal.ai, Makefun ou LTX-Video.');
      } else if (/401|403/.test(msg)) {
        log('info', 'Cle invalide ou expiree.');
      } else if (/429/.test(msg)) {
        log('info', 'Limite de debit atteinte. Patientez quelques minutes.');
      } else if (/Failed to fetch|NetworkError/i.test(msg)) {
        log('info', 'Probleme reseau. Verifiez votre connexion.');
      }
    }).then(function(){
      genBtn.disabled = false;
      genBtn.innerHTML = 'Generer la video';
      abortCtrl = null;
    });
  });

  /* =========================================================
     VIDER LE JOURNAL
     ========================================================= */
  clearBtn.addEventListener('click', function(){
    logEl.innerHTML = '';
    player.style.display = 'none';
    player.innerHTML = '';
    setStatus('', '');
  });

  /* =========================================================
     INITIALISATION
     ========================================================= */
  refreshProviderUI();
})();
</script>
